openapi: 3.1.0
info:
  title: Signal Flow API
  version: 0.1.0
  description: >
    The spec is the contract: handlers are checked against it (server/app.test.ts), and the MCP server
    will check that every page binds to an operation listed here. Phase 2 covers the shell only.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness. Never touches the database.
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ai/status:
    get:
      operationId: getAiStatus
      summary: >
        Whether AI runs are live or simulated (the header indicator). The token holder also gets this month's spend
        and the budget when live. Open to read as the viewer.
      responses:
        '200':
          description: The AI mode.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiStatus' }
  /health/db:
    get:
      operationId: getDatabaseHealth
      summary: Reaches the database. Needs the same access as data routes, because it can wake a suspended compute.
      responses:
        '200':
          description: The database is reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseHealth' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getMe
      summary: >
        The user and workspace this request acts as, and how the request was let in (`via`): a signed-in session (the
        person's own role), the access token or open editing (the demo owner), or, before sign-in exists, the read-only
        demo viewer. Once sign-in is configured and editing is not open, a request with no session is refused with 401
        `unauthenticated`.
      responses:
        '200':
          description: The current context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /members:
    get:
      operationId: listMembers
      summary: Everyone invited to the workspace, owners first. `invited` means they have not signed in yet.
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: inviteMember
      summary: >
        Owners only. Invites an email address with a role. They sign in with Google using that address; their first
        sign-in links the invitation to their account. 409 `already_member` if they are already in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberRequest' }
      responses:
        '201':
          description: Invited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /members/{id}:
    patch:
      operationId: changeMemberRole
      summary: Owners only. Changes a member's role. 409 `last_owner` if it would leave the workspace with no owner.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRoleRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeMember
      summary: >
        Owners only. Removes a member and ends their open sessions. 409 `last_owner` if they are the only owner.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects:
    get:
      operationId: listProjects
      summary: >
        Research projects in the workspace, with the figures shown on a project card. Open to anyone for
        reading (viewer role); cached for a minute so repeated requests do not reach the database.
      responses:
        '200':
          description: The projects, newest first, then by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      summary: >
        Creates a project with its test plan, journey stages, participants and the template's starter tasks,
        in one transaction. Needs the token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: The new project, as it appears on a project card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}:
    get:
      operationId: getProject
      summary: >
        One project with its test plan, journey stages, participants and tasks. The ETag is the project's
        version; send it back in If-Match when saving. Open to read as the viewer; cached for a minute.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      summary: >
        Permanently deletes a project and everything under it (a hard delete; the page asks for confirmation first).
        The audit log keeps the name, actor and time. Needs the token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/stage:
    get:
      operationId: getProjectStage
      summary: >
        Which steps of the project are open, and the hint to show for a locked one. The server decides, so the
        page never re-derives these rules; write endpoints enforce the same ones.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One entry per step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/study:
    put:
      operationId: saveStudy
      summary: >
        Saves the whole test plan page in one save: name, methods, test items and participants. Test items are replaced as
        a list; a participant with an id is updated in place (so transcript speakers matched to it stay matched), one
        without is added, and one left out is removed. Needs the token and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePlanRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProjectSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/transcripts:
    get:
      operationId: getTranscripts
      summary: >
        The project's transcripts with their text, speakers and line counts, and whether the current analysis
        is out of date (the transcripts changed since it ran). Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The transcripts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveTranscripts
      summary: >
        Saves the transcript list. One with an id is kept (and re-read if its text changed), one without is added,
        and one left out is removed. Each is split into speakers and lines; a speaker is matched to a participant by
        name. Saving an empty list retires the current analysis, so the Analyze steps lock again. Needs the token
        and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveTranscriptsRequest' }
      responses:
        '200':
          description: The transcripts as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptList' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/analysis-runs:
    post:
      operationId: startAnalysis
      summary: >
        Runs the analysis over every transcript and stores the themes as a new run; the previous run is kept but
        retired, and requirements documents of the project are flagged stale. Phase 1 is simulated and finishes
        inline (201); a real model would answer 202 and be polled. Needs the token and If-Match. 409 run_in_progress if an
        analysis is already running for the project; 503 ai_budget_reached once the monthly AI budget is spent.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: The finished run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRunResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' } # version_conflict (with current) or run_in_progress
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/themes:
    get:
      operationId: listThemes
      summary: >
        The current analysis's themes, strongest first, with the person's edits applied (a renamed title, a stage
        placement, importance, effort) next to what the analysis suggested. Optional category filter and
        quotes. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: category, in: query, required: false, schema: { type: string, enum: [pain_point, need, expectation, delight] } }
        - { name: include, in: query, required: false, schema: { type: string, enum: [quotes] } }
      responses:
        '200':
          description: The themes and the project's journey stages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /themes/{id}:
    patch:
      operationId: updateTheme
      summary: >
        Edits one theme: rename, move to a journey stage, set importance or effort, pin to the journey map. A key left out
        is untouched; null clears that edit. If-Match is the version of this theme's edits (0 when it has none), so
        edits to different themes never conflict. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThemePatch' }
      responses:
        '200':
          description: The theme as it is now, with its new edit version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Theme' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/priority-overrides:
    delete:
      operationId: resetPriorityOverrides
      summary: Clears every importance and effort edit in the current analysis ("Reset all"). Pins, names and stage placements stay. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The themes after the reset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Theme' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs:
    get:
      operationId: listSpecs
      summary: Requirements documents, newest first. Filter to one project, or to stand-alone documents. Open to read as the viewer.
      parameters:
        - { name: projectId, in: query, required: false, schema: { type: string } }
        - { name: standalone, in: query, required: false, schema: { type: string, enum: ['true'] } }
      responses:
        '200':
          description: The documents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecList' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/specs:
    post:
      operationId: createSpec
      summary: >
        Gets the project's requirements document, starting it from the project's themes if it does not exist yet (a run with the
        eight fixed steps, the first already drafted and waiting for review). A project has one document: when it exists it is
        returned with 200 and nothing is drafted. 409 no_analysis if the project has no themes. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSpecRequest' }
      responses:
        '200':
          description: The document that already existed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecDetail' }
        '201':
          description: The new document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/standalone:
    post:
      operationId: createStandaloneSpec
      summary: >
        Starts a document with no research behind it, drafted from a description alone. It lives in a project of its own kind,
        so it never appears in the research projects list. Needs the token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StandaloneSpecRequest' }
      responses:
        '201':
          description: The new document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/{id}:
    get:
      operationId: getSpec
      summary: >
        One document with its themes, the eight steps (text, evidence, alternatives), the product brief and the requirements
        document built from approved steps. The ETag is the document's version. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSpec
      summary: Permanently deletes the document, its steps and, if published, its stories (a hard delete after the page's confirmation). Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/{id}/themes/{themeId}:
    put:
      operationId: setSpecTheme
      summary: Includes or excludes a theme. It applies to steps not yet started; drafted steps keep what they were written from. If-Match is the document's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: themeId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncludeThemeRequest' }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent-steps/{id}/approve:
    post:
      operationId: approveStep
      summary: >
        Approves the step under review, and starts the next one (unless draftNext is false, when only the approval is made and the next
        step is started with POST /agent-steps/{id}/draft). If-Match is the step's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { name: draftNext, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent-steps/{id}/draft:
    post:
      operationId: draftWaitingStep
      summary: Drafts a waiting step whose earlier step is approved (409 step_not_ready otherwise). If-Match is the step's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent-steps/{id}/redo:
    post:
      operationId: redoStep
      summary: Redraws a step with the person's instructions ("Revised to account for ..."), back under review. If-Match is the step's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedoRequest' }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent-steps/{id}:
    patch:
      operationId: editStep
      summary: Replaces the step's text. The step goes back under review and cannot count as approved until approved again. If-Match is the step's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditStepRequest' }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/design:
    get:
      operationId: getDesign
      summary: >
        The Design step: one row per requirement of the project's published document, with its prototype link, thumbnail flag and design
        notes, and the document's own considered-and-rejected list. 404 no_board until a document is published.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The design table.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Design' }
        '404': { $ref: '#/components/responses/Error' }
  /stories/{id}/design:
    put:
      operationId: saveDesignItem
      summary: >
        Saves the prototype link, notes and (optionally) the thumbnail for one requirement. If-Match is the row's version, 0 when nothing
        has been saved yet. Leaving image out keeps the picture, null removes it. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignRequest' }
      responses:
        '200':
          description: The row as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /stories/{id}/design/image:
    get:
      operationId: getDesignImage
      summary: The thumbnail of one requirement's prototype, as the image itself. 404 when there is none.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The picture.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
  /projects/{id}/measure:
    get:
      operationId: getMeasure
      summary: >
        The Measure step: one row per requirement of the project's published document, with how we will know it worked (metric, source,
        baseline, target), the check-ins made since and the newest verdict, plus a count of each verdict. 404 no_board until a document
        is published.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The measures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measure' }
        '404': { $ref: '#/components/responses/Error' }
  /stories/{id}/measure:
    put:
      operationId: saveMeasureItem
      summary: >
        Saves how one requirement will be measured and all of its check-ins (oldest first). If-Match is the row's version, 0 when nothing
        has been saved yet. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasureRequest' }
      responses:
        '200':
          description: The row as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasureItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /specs/{id}/publish:
    post:
      operationId: publishSpec
      summary: >
        Publishes the document: every step must be approved (409 steps_not_approved otherwise). Each in-scope theme (effort 1 or 2)
        becomes a requirement and a story R1, R2 ... in the order step 5 listed them, each held-out theme (effort 3) becomes an
        open question Q1, Q2 ..., and every card starts in To Do. If-Match is the document's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '201':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/{id}/board-sync:
    post:
      operationId: syncBoard
      summary: >
        After publishing, brings the board in line with the document's included themes. Without apply it only previews. New
        in-scope themes get stories in To Do; stories nobody has touched whose theme is no longer included are removed; stories that
        have been moved, edited or given criteria are never removed, only noted. 409 not_published if the document is a draft.
        Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardSyncRequest' }
      responses:
        '200':
          description: What changes (or changed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardSyncPlan' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/board:
    get:
      operationId: getBoard
      summary: >
        The Stories board of a project: the cards of its most recently published requirements document, the themes they
        come from, and the last move this person made (for Undo). 404 no_board when nothing is published. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Board' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/themes:
    get:
      operationId: getInsightsThemes
      summary: >
        Platform Insights: themes across every analysed project (only each project's latest analysis counts), the participants
        behind each, and the recommendations drawn from them. Open to read as the viewer.
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsThemes' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/themes/{id}:
    get:
      operationId: getPlatformTheme
      summary: One platform theme and where it comes from, per project, with some quotes. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The theme.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformThemeDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/case-studies:
    get:
      operationId: listCaseStudies
      summary: What the team shipped from research, with the platform themes each was based on. Open to read as the viewer.
      responses:
        '200':
          description: The case studies, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CaseStudy' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /stories/{id}:
    get:
      operationId: getStory
      summary: One card with its checklist. The ETag is the card's version. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateStory
      summary: Changes a card's owner team or priority. If-Match is the card's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStoryRequest' }
      responses:
        '200': { $ref: '#/components/responses/StorySaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /stories/{id}/move:
    post:
      operationId: moveStory
      summary: >
        Moves a card to a column, just before another card there or last. Only that card's row changes (the column is renumbered
        first if the neighbours are too close). Dropping a card where it already is changes nothing. Recorded for Undo. If-Match
        is the card's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveStoryRequest' }
      responses:
        '200': { $ref: '#/components/responses/StorySaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /stories/{id}/checklist:
    put:
      operationId: saveChecklist
      summary: >
        Saves the card's checklist (criteria and tasks) as a whole. An item with an id is updated in place, one without is added,
        one left out is removed. The card's progress bar counts criteria only. If-Match is the card's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveChecklistRequest' }
      responses:
        '200': { $ref: '#/components/responses/StorySaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/{id}/undo:
    post:
      operationId: undoMove
      summary: >
        Reverses the last move this person made on the board. 404 nothing_to_undo if there is none; 409 cannot_undo if the card
        has been moved again since. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The card, back where it was.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/tasks:
    put:
      operationId: saveTasks
      summary: Replaces the task list (questions with their follow-ups). Needs the token and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveTasksRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProjectSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /templates:
    get:
      operationId: listTemplates
      summary: Study templates (usability, discovery, concept, blank) and the list of research methods.
      responses:
        '200':
          description: The templates, in display order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version the person was looking at (the ETag of the last read), for example "3".
      schema: { type: string }
  responses:
    StorySaved:
      description: The card as it is now, with its new version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoryDetail' }
    SpecSaved:
      description: The document as it is now.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SpecDetail' }
    ProjectSaved:
      description: Saved. The project as it is now, with its new version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectDetail' }
    VersionConflict:
      description: >
        Someone else saved first. Nothing was changed. The current version is returned so the page can offer
        Reload or Overwrite.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VersionConflict' }
    Error:
      description: >
        Every failure uses this envelope. Codes so far: unauthorized, auth_not_configured, db_unavailable,
        workspace_not_found, unauthenticated, not_invited, email_unverified, already_member, last_owner, not_found, forbidden, invalid_json, validation_failed (with a field), precondition_required, version_conflict, no_transcripts, theme_superseded, spec_published, no_analysis, step_not_ready, steps_not_approved, no_board, nothing_to_undo, cannot_undo, run_in_progress, ai_budget_reached, internal_error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      required: [status, time, version]
      properties:
        status: { type: string, enum: [ok] }
        time: { type: string }
        version: { type: string }
    DatabaseHealth:
      type: object
      required: [status, database, migrations]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [reachable] }
        migrations: { type: integer }
    VersionConflict:
      type: object
      required: [error, current]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [version_conflict] }
            message: { type: string }
        current:
          type: object
          required: [version]
          properties:
            version: { type: integer }
    StageInfo:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: object
          required: [plan, tasks, transcripts, themes, journey, prio, requirements, design, stories, measure]
          properties:
            plan: { $ref: '#/components/schemas/StageTab' }
            tasks: { $ref: '#/components/schemas/StageTab' }
            transcripts: { $ref: '#/components/schemas/StageTab' }
            themes: { $ref: '#/components/schemas/StageTab' }
            journey: { $ref: '#/components/schemas/StageTab' }
            prio: { $ref: '#/components/schemas/StageTab' }
            requirements: { $ref: '#/components/schemas/StageTab' }
            design: { $ref: '#/components/schemas/StageTab' }
            stories: { $ref: '#/components/schemas/StageTab' }
            measure: { $ref: '#/components/schemas/StageTab' }
    StageTab:
      type: object
      required: [enabled, hint]
      properties:
        enabled: { type: boolean }
        hint: { type: [string, 'null'] }
    ProjectDetail:
      type: object
      required: [id, name, color, template, status, sessions, themes, highPriority, measurements, createdAt, version, study, testItems, stages, participants, tasks]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, enum: [cream, mint, yellow, coral, lavender, sky, blue, rose, peach, sand] }
        template: { type: [string, 'null'] }
        status: { type: string, enum: [draft, analyzed] }
        sessions: { type: integer }
        themes: { type: integer }
        highPriority: { type: integer }
        measurements: { type: integer }
        createdAt: { type: string }
        version: { type: integer }
        study:
          type: object
          required: [methods]
          properties:
            methods:
              type: array
              items: { type: string }
        testItems:
          type: array
          items: { $ref: '#/components/schemas/TestItem' }
        stages:
          type: array
          items:
            type: object
            required: [position, name]
            properties:
              position: { type: integer }
              name: { type: string }
        participants:
          type: array
          items:
            type: object
            required: [id, name, role, email, phone, sessionDate]
            properties:
              id: { type: string }
              name: { type: string }
              role: { type: [string, 'null'] }
              email: { type: string }
              phone: { type: [string, 'null'] }
              sessionDate: { type: [string, 'null'] }
        tasks:
          type: array
          items:
            type: object
            required: [id, prompt, followUps]
            properties:
              id: { type: string }
              prompt: { type: string }
              followUps:
                type: array
                items:
                  type: object
                  required: [id, prompt]
                  properties:
                    id: { type: string }
                    prompt: { type: string }
    TestItem:
      type: object
      required: [id, description, outcomes]
      properties:
        id: { type: string }
        description: { type: [string, 'null'], description: What is being tested and what the team wants to learn. }
        outcomes:
          type: array
          items: { type: string }
    TestItemInput:
      type: object
      properties:
        description: { type: [string, 'null'] }
        outcomes:
          type: array
          items: { type: string }
    ParticipantInput:
      type: object
      required: [name, email]
      properties:
        id: { type: [string, 'null'], description: Present for an existing participant. }
        name: { type: string }
        role: { type: [string, 'null'] }
        email: { type: string }
        phone: { type: [string, 'null'] }
        sessionDate: { type: [string, 'null'], description: 'YYYY-MM-DD' }
    SavePlanRequest:
      type: object
      required: [name, participants]
      properties:
        name: { type: string }
        methods:
          type: array
          items: { type: string }
        testItems:
          type: array
          description: An item with neither a description nor outcomes is dropped.
          items: { $ref: '#/components/schemas/TestItemInput' }
        participants:
          type: array
          description: At least one. Name and a valid email are required.
          items: { $ref: '#/components/schemas/ParticipantInput' }
    BoardStory:
      type: object
      required: [id, key, kind, title, status, position, priority, ownerTeam, summary, whyItMatters, nextStep, syncNote, theme, criteriaMet, criteriaTotal, version]
      properties:
        id: { type: string }
        key: { type: string, description: R1, R2 ... for requirements; Q1, Q2 ... for open questions. }
        kind: { type: string, enum: [requirement, open_question] }
        title: { type: string }
        status: { type: string, enum: [todo, in_progress, in_review, done] }
        position: { type: number, description: Order within the column; a card dropped between two others takes the number halfway between them. }
        priority: { type: string, enum: [low, medium, high] }
        ownerTeam: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        whyItMatters: { type: [string, 'null'] }
        syncNote: { type: [string, 'null'], description: A note when the document no longer agrees with this story (see Update board). }
        nextStep: { type: [string, 'null'] }
        theme:
          type: [object, 'null']
          required: [id, title, category, participantCount, totalParticipants]
          properties:
            id: { type: string }
            title: { type: string }
            category: { type: string }
            participantCount: { type: integer }
            totalParticipants: { type: integer }
        criteriaMet: { type: integer }
        criteriaTotal: { type: integer }
        version: { type: integer }
    ChecklistItem:
      type: object
      required: [id, kind, text, met, position]
      properties:
        id: { type: string }
        kind: { type: string, enum: [criterion, task] }
        text: { type: string }
        met: { type: boolean }
        position: { type: integer }
    StoryDetail:
      type: object
      required: [id, key, kind, title, status, position, priority, ownerTeam, summary, whyItMatters, nextStep, syncNote, theme, criteriaMet, criteriaTotal, version, specId, checklist]
      properties:
        id: { type: string }
        key: { type: string }
        kind: { type: string, enum: [requirement, open_question] }
        title: { type: string }
        status: { type: string, enum: [todo, in_progress, in_review, done] }
        position: { type: number }
        priority: { type: string, enum: [low, medium, high] }
        ownerTeam: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        whyItMatters: { type: [string, 'null'] }
        syncNote: { type: [string, 'null'], description: A note when the document no longer agrees with this story (see Update board). }
        nextStep: { type: [string, 'null'] }
        theme:
          type: [object, 'null']
          required: [id, title, category, participantCount, totalParticipants]
          properties:
            id: { type: string }
            title: { type: string }
            category: { type: string }
            participantCount: { type: integer }
            totalParticipants: { type: integer }
        criteriaMet: { type: integer }
        criteriaTotal: { type: integer }
        version: { type: integer }
        specId: { type: string }
        checklist:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
    InsightsThemes:
      type: object
      required: [projects, totalParticipants, themes, recommendations]
      properties:
        projects:
          type: array
          description: Projects with a current analysis, oldest first.
          items:
            type: object
            required: [id, name, color, participants]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              color: { type: string }
              participants: { type: integer }
        totalParticipants: { type: integer }
        themes:
          type: array
          items:
            type: object
            required: [id, title, category, participantCount, projectCount, sources]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              category: { type: string, enum: [pain_point, need, expectation, delight] }
              participantCount: { type: integer }
              projectCount: { type: integer }
              sources:
                type: array
                items:
                  type: object
                  required: [projectId, participantCount]
                  properties:
                    projectId: { type: string, format: uuid }
                    participantCount: { type: integer }
        recommendations:
          type: array
          items:
            type: object
            required: [id, title, why, priority, themes, participantCount, projectCount]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              why: { type: [string, 'null'] }
              priority: { type: string, enum: [low, medium, high] }
              themes:
                type: array
                items:
                  type: object
                  required: [id, title]
                  properties:
                    id: { type: string, format: uuid }
                    title: { type: string }
              participantCount: { type: integer }
              projectCount: { type: integer }
    PlatformThemeDetail:
      type: object
      required: [id, title, category, participantCount, totalParticipants, projectCount, totalProjects, sources]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string, enum: [pain_point, need, expectation, delight] }
        participantCount: { type: integer }
        totalParticipants: { type: integer }
        projectCount: { type: integer }
        totalProjects: { type: integer }
        sources:
          type: array
          items:
            type: object
            required: [projectId, projectName, color, participantCount, projectParticipants, matchMethod, quotes]
            properties:
              projectId: { type: string, format: uuid }
              projectName: { type: string }
              color: { type: string }
              participantCount: { type: integer }
              projectParticipants: { type: integer }
              matchMethod: { type: string, enum: [auto, manual], description: 'manual when someone tagged a theme by hand.' }
              quotes:
                type: array
                items:
                  type: object
                  required: [id, text, speaker, session, timestamp]
                  properties:
                    id: { type: string, format: uuid }
                    text: { type: string }
                    speaker: { type: string }
                    session: { type: string }
                    timestamp: { type: [string, 'null'] }
    CaseStudy:
      type: object
      required: [id, title, summary, outcome, ownerTeam, date, color, themes]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
        ownerTeam: { type: [string, 'null'] }
        date: { type: [string, 'null'], description: 'YYYY-MM-DD; only the month is shown.' }
        color: { type: string }
        themes:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
    Board:
      type: object
      required: [specId, specName, projectId, projectName, stories, themes, lastMove]
      properties:
        specId: { type: string }
        specName: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        stories:
          type: array
          items: { $ref: '#/components/schemas/BoardStory' }
        themes:
          type: array
          items:
            type: object
            required: [id, title, count]
            properties:
              id: { type: string }
              title: { type: string }
              count: { type: integer }
        lastMove:
          type: [object, 'null']
          required: [storyId, key, title, from, to]
          properties:
            storyId: { type: string }
            key: { type: string }
            title: { type: string }
            from: { type: string, enum: [todo, in_progress, in_review, done] }
            to: { type: string, enum: [todo, in_progress, in_review, done] }
    MoveStoryRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [todo, in_progress, in_review, done] }
        beforeId: { type: [string, 'null'], description: The card in that column to drop before; null for the end of the column. }
    UpdateStoryRequest:
      type: object
      properties:
        ownerTeam: { type: [string, 'null'] }
        priority: { type: string, enum: [low, medium, high] }
    SaveChecklistRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, text, met]
            properties:
              id: { type: [string, 'null'] }
              kind: { type: string, enum: [criterion, task] }
              text: { type: string }
              met: { type: boolean }
    SpecSummary:
      type: object
      required: [id, projectId, projectName, standalone, name, status, publishedAt, stale, approved, total, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        standalone: { type: boolean }
        name: { type: string }
        status: { type: string, enum: [draft, published] }
        publishedAt: { type: [string, 'null'] }
        stale: { type: boolean, description: The project was analysed again after this document was drafted. }
        approved: { type: integer }
        total: { type: integer }
        createdAt: { type: string }
    SpecList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SpecSummary' }
    SpecDetail:
      type: object
      required: [id, projectId, projectName, standalone, name, status, publishedAt, stale, version, sessions, themes, steps, brief, document, approved, total, canPublish, preview, boardChanges]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        standalone: { type: boolean }
        name: { type: string }
        status: { type: string, enum: [draft, published] }
        publishedAt: { type: [string, 'null'] }
        stale: { type: boolean }
        version: { type: integer }
        sessions: { type: integer }
        themes:
          type: array
          items:
            type: object
            required: [id, title, category, priority, effort, participantCount, totalParticipants, included]
            properties:
              id: { type: string }
              title: { type: string }
              category: { type: string, enum: [pain_point, need, expectation, delight] }
              priority: { type: string, enum: [low, medium, high] }
              effort: { type: integer }
              participantCount: { type: integer }
              totalParticipants: { type: integer }
              included: { type: boolean }
        steps:
          type: array
          items:
            type: object
            required: [id, position, key, title, status, text, originalText, edited, redoNote, revision, version, evidence, alternatives, approvedAt, behind]
            properties:
              id: { type: string }
              position: { type: integer }
              key: { type: string }
              title: { type: string }
              status: { type: string, enum: [pending, review, approved] }
              text: { type: [string, 'null'], description: "The text shown, which is the person's edit if there is one, else the draft." }
              originalText: { type: [string, 'null'] }
              edited: { type: boolean }
              redoNote: { type: [string, 'null'] }
              revision: { type: integer }
              version: { type: integer }
              evidence:
                type: array
                items:
                  type: object
                  required: [themeId, title, label]
                  properties:
                    themeId: { type: string }
                    title: { type: string }
                    label: { type: string }
              alternatives:
                type: array
                items:
                  type: object
                  required: [title, reason]
                  properties:
                    title: { type: string }
                    reason: { type: string }
              approvedAt: { type: [string, 'null'] }
              behind: { type: boolean, description: An earlier step changed after this one was written, so it may no longer follow from it. }
        brief:
          type: object
          required: [problem, users, goals, locked]
          properties:
            problem: { type: [string, 'null'] }
            users: { type: [string, 'null'] }
            goals:
              type: [array, 'null']
              items: { type: string }
            locked: { type: boolean, description: Steps 1 to 3 are approved. }
        document:
          type: array
          items:
            type: object
            required: [heading, lines]
            properties:
              heading: { type: string }
              lines:
                type: array
                items: { type: string }
        approved: { type: integer }
        total: { type: integer }
        canPublish: { type: boolean }
        preview:
          type: object
          required: [requirements, openQuestions]
          properties:
            requirements: { type: integer }
            openQuestions: { type: integer }
        boardChanges:
          type: [integer, 'null']
          description: Published documents only. How many board changes Update board would make; 0 when the board agrees with the document.
    BoardChange:
      type: object
      required: [key, title, kind, reason]
      properties:
        key: { type: string }
        title: { type: string }
        kind: { type: string, enum: [requirement, open_question] }
        reason: { type: string }
    BoardSyncRequest:
      type: object
      properties:
        apply: { type: boolean, description: False or missing only previews. }
    BoardSyncPlan:
      type: object
      required: [add, remove, flag, clear, keep, applied]
      properties:
        add:
          type: array
          items: { $ref: '#/components/schemas/BoardChange' }
        remove:
          type: array
          description: Stories nobody has touched whose theme is no longer included.
          items: { $ref: '#/components/schemas/BoardChange' }
        flag:
          type: array
          description: Stories that have been worked on; kept, with a note.
          items: { $ref: '#/components/schemas/BoardChange' }
        clear:
          type: array
          description: Stories whose note is removed because they agree with the document again.
          items: { $ref: '#/components/schemas/BoardChange' }
        keep: { type: integer }
        applied: { type: boolean }
    PublishResult:
      type: object
      required: [specId, requirements, openQuestions, projectId]
      properties:
        specId: { type: string }
        requirements: { type: integer }
        openQuestions: { type: integer }
        projectId: { type: string }
    CreateSpecRequest:
      type: object
      properties:
        name: { type: string }
    StandaloneSpecRequest:
      type: object
      required: [name, what]
      properties:
        name: { type: string }
        what: { type: string }
    IncludeThemeRequest:
      type: object
      required: [included]
      properties:
        included: { type: boolean }
    RedoRequest:
      type: object
      required: [instructions]
      properties:
        instructions: { type: string }
    EditStepRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
    Quote:
      type: object
      required: [id, speaker, participant, session, timestamp, text]
      properties:
        id: { type: string }
        speaker: { type: string }
        participant: { type: [string, 'null'], description: The matched participant's name. }
        session: { type: string, description: The transcript's name without its extension. }
        timestamp: { type: [string, 'null'] }
        text: { type: string }
    Theme:
      type: object
      required: [id, title, originalTitle, category, stagePosition, suggestedStagePosition, severity, description, opportunity, priority, suggestedPriority, effort, suggestedEffort, effortNote, edited, overrideVersion, participantCount, totalParticipants, mentionCount, score]
      properties:
        id: { type: string }
        title: { type: string, description: The person's name for the theme if they renamed it, otherwise the analysis's. }
        originalTitle: { type: string }
        category: { type: string, enum: [pain_point, need, expectation, delight] }
        stagePosition: { type: [integer, 'null'], description: The journey stage it sits in (the person's choice, else the suggestion). }
        suggestedStagePosition: { type: [integer, 'null'] }
        severity: { type: [number, 'null'] }
        description: { type: [string, 'null'] }
        opportunity: { type: [string, 'null'] }
        priority: { type: string, enum: [low, medium, high], description: Importance, as edited or suggested. }
        suggestedPriority: { type: string, enum: [low, medium, high] }
        effort: { type: integer }
        suggestedEffort: { type: integer }
        effortNote: { type: [string, 'null'] }
        edited: { type: boolean, description: Importance or effort differs from the suggestion. }
        overrideVersion: { type: integer }
        participantCount: { type: integer }
        totalParticipants: { type: integer }
        mentionCount: { type: integer }
        score: { type: [number, 'null'] }
        quotes:
          type: array
          items: { $ref: '#/components/schemas/Quote' }
    ThemeList:
      type: object
      required: [data, stages]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Theme' }
        stages:
          type: array
          items:
            type: object
            required: [position, name]
            properties:
              position: { type: integer }
              name: { type: string }
    ThemePatch:
      type: object
      properties:
        title: { type: [string, 'null'] }
        stagePosition: { type: [integer, 'null'] }
        priority: { type: [string, 'null'], enum: [low, medium, high] }
        effort: { type: [integer, 'null'] }
    TranscriptList:
      type: object
      required: [transcripts, hasAnalysis, needsAnalysis, analyzedAt]
      properties:
        transcripts:
          type: array
          items:
            type: object
            required: [id, name, platform, rawText, lineCount, speakers]
            properties:
              id: { type: string }
              name: { type: string }
              platform: { type: [string, 'null'], enum: [zoom, meet, teams] }
              rawText: { type: string }
              lineCount: { type: integer }
              speakers:
                type: array
                items:
                  type: object
                  required: [name, role, participant]
                  properties:
                    name: { type: string }
                    role: { type: string, enum: [participant, moderator] }
                    participant: { type: [string, 'null'], description: The matched participant's name. }
        hasAnalysis: { type: boolean }
        needsAnalysis: { type: boolean, description: True when there are transcripts and the current analysis did not read exactly these. }
        analyzedAt: { type: [string, 'null'] }
    SaveTranscriptsRequest:
      type: object
      required: [transcripts]
      properties:
        transcripts:
          type: array
          items:
            type: object
            required: [name, rawText]
            properties:
              id: { type: [string, 'null'] }
              name: { type: string }
              platform: { type: [string, 'null'], enum: [zoom, meet, teams] }
              rawText: { type: string }
    AnalysisRunResult:
      type: object
      required: [runId, themes, steps]
      properties:
        runId: { type: string }
        themes: { type: integer }
        steps:
          type: array
          items: { type: string }
        fallback: { type: string, enum: [budget, credit], description: 'Present when the live model could not be used (monthly budget or account credit used up) and the simulation ran instead.' }
    SaveTasksRequest:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            type: object
            required: [prompt]
            properties:
              prompt: { type: string }
              followUps:
                type: array
                items: { type: string }
    TemplateList:
      type: object
      required: [data, methodOptions]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Template' }
        methodOptions:
          type: array
          items: { type: string }
    Template:
      type: object
      required: [key, name, description, what, jtbd, outcomes, methods, tasks]
      properties:
        key: { type: string, enum: [usability, discovery, concept, blank] }
        name: { type: string }
        description: { type: [string, 'null'] }
        what: { type: string }
        jtbd:
          type: object
          required: [when, want, so]
          properties:
            when: { type: string }
            want: { type: string }
            so: { type: string }
        outcomes:
          type: array
          items: { type: string }
        methods:
          type: array
          items: { type: string }
        tasks:
          type: array
          items:
            type: object
            required: [prompt, followUps]
            properties:
              prompt: { type: string }
              followUps:
                type: array
                items: { type: string }
    CreateProjectRequest:
      type: object
      required: [name, participants]
      properties:
        name: { type: string }
        templateKey: { type: string, enum: [usability, discovery, concept, blank], description: Optional; the test plan page no longer offers templates, so new projects use blank. }
        methods:
          type: array
          items: { type: string }
        testItems:
          type: array
          items: { $ref: '#/components/schemas/TestItemInput' }
        participants:
          type: array
          description: At least one. Name and a valid email are required.
          items: { $ref: '#/components/schemas/ParticipantInput' }
    ProjectList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectSummary' }
        next_cursor:
          type: [string, 'null']
    ProjectSummary:
      type: object
      required: [id, name, color, template, status, sessions, themes, highPriority, measurements, createdAt, version]
      properties:
        id: { type: string }
        name: { type: string }
        color:
          type: string
          description: A tint token name; the page maps it to var(--at-tint-<color>).
          enum: [cream, mint, yellow, coral, lavender, sky, blue, rose, peach, sand]
        template: { type: [string, 'null'] }
        status:
          type: string
          description: Derived, not stored. draft means the current analysis has no themes.
          enum: [draft, analyzed]
        sessions: { type: integer, description: Transcripts in the project. }
        themes: { type: integer, description: Themes in the current analysis. }
        highPriority: { type: integer, description: Themes whose suggested priority is high. }
        measurements: { type: integer, description: 'Requirements with a metric or a finding recorded in the Measure step.' }
        createdAt: { type: string }
        version: { type: integer }
    DesignItem:
      type: object
      required: [storyId, key, title, priority, summary, whyItMatters, theme, prototypeUrl, notes, hasImage, version]
      properties:
        storyId: { type: string }
        key: { type: string, description: 'R1, R2 ...' }
        title: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        summary: { type: [string, 'null'] }
        whyItMatters: { type: [string, 'null'] }
        theme:
          type: [object, 'null']
          required: [title, participantCount, totalParticipants]
          properties:
            title: { type: string }
            participantCount: { type: integer }
            totalParticipants: { type: integer }
        prototypeUrl: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        hasImage: { type: boolean }
        version: { type: integer, description: '0 when nothing has been saved for this requirement yet.' }
    Design:
      type: object
      required: [specId, specName, projectId, decisions, items]
      properties:
        specId: { type: string }
        specName: { type: string }
        projectId: { type: string }
        decisions:
          type: object
          required: [reasoning, alternatives]
          properties:
            reasoning: { type: [string, 'null'] }
            alternatives:
              type: array
              items:
                type: object
                required: [title, reason]
                properties:
                  title: { type: string }
                  reason: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/DesignItem' }
    DesignRequest:
      type: object
      properties:
        prototypeUrl: { type: [string, 'null'], description: 'A link starting with http:// or https://.' }
        notes: { type: [string, 'null'] }
        image:
          type: [object, 'null']
          description: A small downscaled picture, base64 (at most about 600 KB decoded).
          required: [type, data]
          properties:
            type: { type: string, enum: [image/jpeg, image/png, image/webp] }
            data: { type: string }
    Checkin:
      type: object
      required: [on, value, verdict, note]
      properties:
        on: { type: string, description: 'The day of the check-in, YYYY-MM-DD.' }
        value: { type: string, maxLength: 2000, description: 'What was seen, in words or numbers; it can run to a few sentences.' }
        verdict: { type: string, enum: [worked, needs_attention, too_early] }
        note: { type: [string, 'null'] }
    MeasureItem:
      type: object
      required: [storyId, key, title, priority, summary, whyItMatters, metric, source, baseline, target, checkins, result, version]
      properties:
        storyId: { type: string }
        key: { type: string, description: 'R1, R2 ...' }
        title: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        summary: { type: [string, 'null'] }
        whyItMatters: { type: [string, 'null'] }
        metric: { type: [string, 'null'], description: How we will know it worked. }
        source:
          type: [string, 'null']
          enum: [telemetry, kpi, support_tickets, research, other, null]
        baseline: { type: [string, 'null'] }
        target: { type: [string, 'null'] }
        checkins:
          type: array
          description: Oldest first.
          items: { $ref: '#/components/schemas/Checkin' }
        result:
          type: [string, 'null']
          enum: [worked, needs_attention, too_early, null]
          description: The newest check-in's verdict, null before the first one.
        version: { type: integer, description: '0 when nothing has been saved for this requirement yet.' }
    Measure:
      type: object
      required: [specId, specName, projectId, summary, items]
      properties:
        specId: { type: string }
        specName: { type: string }
        projectId: { type: string }
        summary:
          type: object
          required: [total, worked, needsAttention, tooEarly, notMeasured]
          properties:
            total: { type: integer }
            worked: { type: integer }
            needsAttention: { type: integer }
            tooEarly: { type: integer }
            notMeasured: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/MeasureItem' }
    MeasureRequest:
      type: object
      required: [checkins]
      properties:
        metric: { type: [string, 'null'] }
        source:
          type: [string, 'null']
          enum: [telemetry, kpi, support_tickets, research, other, null]
        baseline: { type: [string, 'null'] }
        target: { type: [string, 'null'] }
        checkins:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/Checkin' }
    AiStatus:
      type: object
      required: [mode, enabled]
      properties:
        mode: { type: string, enum: [live, simulated] }
        enabled: { type: boolean, description: 'False when the AI_ENABLED=false kill switch is set.' }
        budgetUsd: { type: number }
        spentUsd: { type: number }
        problems:
          type: array
          description: The most recent problems with model calls in the past 30 days (up to 10, newest first). Only owners and editors receive it, and only when there are some.
          items:
            type: object
            required: [at, purpose, code, message, detail]
            properties:
              at: { type: string, format: date-time }
              purpose: { type: string, description: 'analysis, spec_step or theme_match.' }
              code: { type: string, description: 'For example ai_output_unusable, ai_credit_exhausted or ai_budget_reached.' }
              message: { type: string }
              detail: { type: [string, 'null'], description: 'What was wrong with the reply, or what the app did instead. Never research text.' }
    Me:
      type: object
      required: [userId, email, displayName, workspaceId, workspaceName, role, via, signInAvailable]
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        workspaceId: { type: string }
        workspaceName: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        via: { type: string, enum: [session, token, open, anonymous], description: 'How this request was let in.' }
        signInAvailable: { type: boolean, description: 'True when Google sign-in is configured on this deployment.' }
    Member:
      type: object
      required: [id, email, displayName, role, status, avatarUrl]
      properties:
        id: { type: string, description: 'The membership id.' }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        status: { type: string, enum: [active, invited], description: 'Invited until their first sign-in.' }
        avatarUrl: { type: string, nullable: true }
    MemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Member' }
    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [owner, editor, viewer] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
