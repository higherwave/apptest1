              title: { type: string }
              prototypeUrl: { type: [string, 'null'] }
              notes: { type: [string, 'null'] }
        results:
          type: [object, 'null']
          description: What the Measure step shows; null until a document is published.
          required: [summary, items]
          properties:
            summary:
              type: object
              required: [worked, needsAttention, tooEarly, notMeasured]
              properties:
                worked: { type: integer }
                needsAttention: { type: integer }
                tooEarly: { type: integer }
                notMeasured: { type: integer }
            items:
              type: array
