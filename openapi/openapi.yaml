openapi: 3.1.0
info:
  title: Signal Flow API
  version: 0.1.0
  description: >
    The spec is the contract: handlers are checked against it (server/app.test.ts), and the MCP server
    will check that every page binds to an operation listed here. Phase 2 covers the shell only.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness. Never touches the database.
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ai/status:
    get:
      operationId: getAiStatus
      summary: >
        Whether AI runs are live or simulated (the header indicator), for everyone. Owners also get this month's spend and
        the budget when live, and what recently went wrong (the AI usage and costs tab in Admin); nobody else does.
      responses:
        '200':
          description: The AI mode.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiStatus' }
  /health/db:
    get:
      operationId: getDatabaseHealth
      summary: Reaches the database. Needs the same access as data routes, because it can wake a suspended compute.
      responses:
        '200':
          description: The database is reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseHealth' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /health/capture:
    get:
      operationId: getCaptureHealth
      summary: >
        Whether thumbnails from prototype links can work on this deployment, step by step: the browser package, its unpacking, starting
        it, drawing a page. Public and read-only (it visits no address and reads no data); the answer is kept for five minutes.
      responses:
        '200':
          description: The result of each step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureHealth' }
  /me:
    get:
      operationId: getMe
      summary: >
        The user and workspace this request acts as, and how the request was let in (`via`): a signed-in session (the
        person's own role), the access token or open editing (the demo owner), or, before sign-in exists, the read-only
        demo viewer. Once sign-in is configured and editing is not open, a request with no session is refused with 401
        `unauthenticated`.
      responses:
        '200':
          description: The current context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sign-in-options:
    get:
      operationId: getSignInOptions
      summary: >
        The ways to sign in on this deployment (Google, the company's own single sign-on), for the sign-in screen. Public: it
        needs no session and reveals no data. Empty when sign-in is not configured.
      responses:
        '200':
          description: The sign-in options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInOptionList' }
  /areas:
    get:
      operationId: listAreas
      summary: >
        The workspace's experience categories: the shared list of what research is about (Scheduling, Reminders), with how many questions and tasks use each. Active ones first, then retired ones.
      responses:
        '200':
          description: The areas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaList' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createArea
      summary: >
        Adds an area (owner or editor). 409 `duplicate_area` when the name is, or is an alias of, an existing area (use it; `existing` says
        which); 409 `similar_area` when it only resembles one (`similar` lists them), unless `force` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAreaRequest' }
      responses:
        '201':
          description: The new area.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /areas/proposals:
    get:
      operationId: listAreaProposals
      summary: >
        Suggested new experience categories: groups of current themes that have no area and share a word no area covers, raised by at least three people.
        Worked out from the words alone (no model call). A group someone dismissed is not listed.
      responses:
        '200':
          description: The suggestions, strongest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaProposalList' }
        '401': { $ref: '#/components/responses/Error' }
  /areas/proposals/accept:
    post:
      operationId: acceptAreaProposal
      summary: >
        Owners and editors. Adds the suggested area (under the name given, or the suggested one) and files the group's themes under it.
        404 when the group has changed or been dismissed since the page loaded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptAreaProposalRequest' }
      responses:
        '201':
          description: The area and how many themes were filed under it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedAreaProposal' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /areas/proposals/dismiss:
    post:
      operationId: dismissAreaProposal
      summary: Owners and editors. Says not now to a suggestion; it is not offered again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DismissAreaProposalRequest' }
      responses:
        '204': { description: Dismissed. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /areas/{id}:
    patch:
      operationId: updateArea
      summary: Owners and editors. Changes the name, definition and aliases; a changed name stays as an alias. If-Match is the area's version.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAreaRequest' }
      responses:
        '200':
          description: The area as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /areas/{id}/merge:
    post:
      operationId: mergeArea
      summary: >
        Owners only. Folds this area into another: its questions and tasks move, its name and aliases become aliases of the
        target, and it is retired (`mergedInto` says where it went). Returns the target.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeAreaRequest' }
      responses:
        '200':
          description: The area it was merged into.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /areas/{id}/retire:
    post:
      operationId: retireArea
      summary: Owners only. Takes an area off the picker. What already uses it keeps it.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The retired area.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /members:
    get:
      operationId: listMembers
      summary: Owners only (403 otherwise). Everyone invited to the workspace, owners first. `invited` means they have not signed in yet.
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: inviteMember
      summary: >
        Owners only. Invites an email address with a role. They sign in with that address; their first
        sign-in links the invitation to their account. 409 `already_member` if they are already in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberRequest' }
      responses:
        '201':
          description: Invited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /members/{id}:
    patch:
      operationId: changeMemberRole
      summary: >
        Owners only. Changes a member's role and/or marks them external or not. 409 `last_owner` if it would leave the workspace with no owner; 409
        `external_needs_viewer` for an external member who is not a viewer. Marking someone external ends any all-teams reviewer assignment they hold.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMemberRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeMember
      summary: >
        Owners only. Removes a member and ends their open sessions. 409 `last_owner` if they are the only owner.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /teams:
    get:
      operationId: listTeams
      summary: >
        Owners (leaders) only, 403 otherwise. Every team with its people (and their role in it) and its research projects, the default team first.
      responses:
        '200':
          description: The teams.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTeam
      summary: Owners only. Creates a team. 409 `team_name_taken` if the name is in use (case does not matter).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamNameRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /teams/{id}:
    patch:
      operationId: renameTeam
      summary: Owners only. Renames a team. 409 `team_name_taken`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamNameRequest' }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTeam
      summary: >
        Owners only. Deletes an empty team and its memberships. 409 `team_is_default` for the default team, and `team_has_projects` while it still has
        projects (move them first).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /reviewers:
    get:
      operationId: getReviewers
      summary: >
        Owners only. The launch reviewers (standing assignments: a person, a step, all teams or one team, primary or alternate) and, for each team, a
        coverage cell per step: `covered` (at least one primary), `gap` (a step the team uses with no primary; an alternate alone is still a gap) or
        `not_used` (the team turned the step off). A step with no reviewer is always shown as a gap, never hidden.
      responses:
        '200':
          description: The reviewers and the coverage grid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewerOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: addReviewer
      summary: >
        Owners only. Sets a member up for one or more steps, for all teams or for named teams, as primary or alternate. A step and scope the person
        already has is updated to the new role. 409 `primary_taken` if another person is already the primary for a step and team (or all teams);
        422 `external_all_teams` for an external member and all teams; 404 for an unknown member or team.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddReviewerRequest' }
      responses:
        '201':
          description: The reviewers and coverage as they are now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewerOverview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /reviewers/{id}:
    delete:
      operationId: removeReviewer
      summary: Owners only. Ends one standing assignment. Launches then show the step as approver missing if nobody else covers it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The reviewers and coverage as they are now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewerOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{id}/launch-steps:
    put:
      operationId: setTeamLaunchSteps
      summary: >
        Owners only. Says which optional steps this team's launches use (`used` maps a step to true or false). A step the team uses but nobody covers
        shows as a gap, not as hidden. The final decision always applies and cannot be set (422 `bad_step`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamLaunchStepsRequest' }
      responses:
        '200':
          description: The reviewers and coverage as they are now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewerOverview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{id}/members/{memberId}:
    put:
      operationId: setTeamMember
      summary: >
        Owners only. Puts a workspace member in the team with a role, or changes their role there. `memberId` is the id from the Members list. 404 if the
        team or the member does not exist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRoleRequest' }
      responses:
        '200':
          description: The team as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeTeamMember
      summary: Owners only. Takes a person out of the team (they stay in the workspace).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /teams/{id}/projects/{projectId}:
    put:
      operationId: moveProjectToTeam
      summary: Owners only. Moves a research project into this team. 404 if the team or the project does not exist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The team as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /workflows:
    get:
      operationId: listWorkflows
      summary: >
        The workflows (the service blueprint): each with its stages, and under each stage what good looks like, the signal to watch, the handoff
        and the backstage (teams, systems and processes, with owners). Open to read as the viewer.
      responses:
        '200':
          description: The workflows, by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowList' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createWorkflow
      summary: Owners and editors. Adds a workflow with its stages. 409 `duplicate_workflow` if the name is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowRequest' }
      responses:
        '201':
          description: The workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /workflows/sample:
    post:
      operationId: addSampleWorkflows
      summary: >
        Owners and editors. Adds the Anchor CX example workflow if it is not there yet (matched by name), puts on it the projects that are on no workflow and whose
        journey stages all match its stages by name, and returns every workflow.
      responses:
        '201':
          description: Every workflow, including the example.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /workflows/{id}:
    put:
      operationId: saveWorkflow
      summary: >
        Owners and editors. Saves the whole workflow: a stage or backstage entry that keeps its id is changed in place (so projects mapped to it stay
        mapped), one without an id is added, and one left out is removed. If-Match is the workflow's version; a save that changes nothing keeps it.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowRequest' }
      responses:
        '200':
          description: The workflow as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteWorkflow
      summary: Owners and editors. Deletes a workflow. The projects on it are taken off it and their stage mapping is cleared; the audit log records how many.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/blueprint:
    get:
      operationId: getProjectBlueprint
      summary: The workflow a project is on (or null) and, for each of the project's journey stages, the workflow stage it is mapped to, with that stage's backstage.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The project's blueprint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBlueprint' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/workflow:
    put:
      operationId: setProjectWorkflow
      summary: >
        Owners and editors. Puts the project on a workflow (one per project) or takes it off with null. Its journey stages are mapped to the
        workflow's by name; a stage with no clear match stays unmapped.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetProjectWorkflowRequest' }
      responses:
        '200':
          description: The project's blueprint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBlueprint' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/stage-map:
    put:
      operationId: mapProjectStage
      summary: Owners and editors. Maps one of the project's journey stages to a stage of its workflow, or clears it with null.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MapStageRequest' }
      responses:
        '200':
          description: The project's blueprint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBlueprint' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /usage:
    get:
      operationId: getUsage
      summary: >
        Owners only (403 otherwise). How much of each limit the app has used. Today one row, the database's size against `DATABASE_SIZE_LIMIT_MB`
        (default 1024, 0 for no limit); it is read from the database itself.
      responses:
        '200':
          description: The usage rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /notifications/preferences:
    get:
      operationId: getNotificationPreferences
      summary: >
        The signed-in person's settings for the daily reminder email: whether it is on, their time zone (null until their browser has reported
        it), whether they can receive it (owners and editors), and whether this deployment can send email at all.
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveNotificationPreferences
      summary: Changes the signed-in person's reminder settings. Send only what changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                digestEnabled: { type: boolean }
                timeZone: { type: string, description: 'An IANA time zone such as Europe/London.' }
      responses:
        '204': { description: Saved. }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /notifications/digest/test:
    post:
      operationId: sendReminderNow
      summary: >
        Sends the signed-in owner or editor their reminder immediately, for testing and demos. It skips the 6am wait and the stop rule, and is
        sent even when the reminder is switched off. `outcome` says what happened: `sent`, `nothing_left` (no project has a step to do),
        `not_configured` (this deployment cannot send email) or `failed` (with `error`).
      responses:
        '200':
          description: What happened.
          content:
            application/json:
              schema:
                type: object
                required: [outcome]
                properties:
                  outcome: { type: string, enum: [sent, nothing_left, not_configured, failed] }
                  error: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /notifications/unsubscribe:
    get:
      operationId: unsubscribeFromReminders
      summary: >
        The one-click link in every reminder email. Public: it is opened from an email and needs no session. A signed link (`u` the person, `t` the
        signature) switches their reminder off and returns a small page; any other link returns 400 and changes nothing.
      parameters:
        - { name: u, in: query, required: true, schema: { type: string } }
        - { name: t, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Unsubscribed (an HTML page). }
        '400': { description: The link is not valid (an HTML page). }
  /cron/digest:
    get:
      operationId: runReminderJob
      summary: >
        The hourly job. Sends the daily reminder to everyone for whom it is 6am now. Needs `Authorization: Bearer <CRON_SECRET>`, which Vercel's
        cron sends itself; 503 when `CRON_SECRET` is not set.
      responses:
        '200':
          description: How many were sent, failed, had nothing to be told, or had already been sent today.
          content:
            application/json:
              schema:
                type: object
                required: [sent, failed, nothingToSay, alreadySent]
                properties:
                  sent: { type: integer }
                  failed: { type: integer }
                  nothingToSay: { type: integer }
                  alreadySent: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /audit:
    get:
      operationId: listAudit
      summary: >
        Owners only (403 otherwise). What changed in the workspace and who changed it, newest first: people and roles, experience categories,
        projects, workflows and Jira hand-offs. Pass `nextCursor` back as `cursor` for the next page.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string, enum: [members, teams, reviewers, categories, projects, workflows, jira] } }
        - { name: teamId, in: query, required: false, schema: { type: string }, description: 'Only changes about this team: its people, its projects and the team itself.' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: One page of the log.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects:
    get:
      operationId: listProjects
      summary: >
        Research projects in the workspace, with the figures shown on a project card. Open to anyone for
        reading (viewer role); cached for a minute so repeated requests do not reach the database.
      responses:
        '200':
          description: The projects, newest first, then by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      summary: >
        Creates a project with its test plan, journey stages, participants and the template's starter tasks,
        in one transaction. Needs the token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: The new project, as it appears on a project card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}:
    get:
      operationId: getProject
      summary: >
        One project with its test plan, journey stages, participants and tasks. The ETag is the project's
        version; send it back in If-Match when saving. Open to read as the viewer; cached for a minute.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      summary: >
        Permanently deletes a project and everything under it (a hard delete; the page asks for confirmation first).
        The audit log keeps the name, actor and time. Needs the token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/stage:
    get:
      operationId: getProjectStage
      summary: >
        Which steps of the project are open, and the hint to show for a locked one. The server decides, so the
        page never re-derives these rules; write endpoints enforce the same ones.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One entry per step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/study:
    put:
      operationId: saveStudy
      summary: >
        Saves the whole test plan page in one save: name, description, methods and participants. A participant with an id is updated in place (so transcript speakers matched to it stay matched), one
        without is added, and one left out is removed. Needs the token and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePlanRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProjectSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/transcripts:
    get:
      operationId: getTranscripts
      summary: >
        The project's transcripts with their text, speakers and line counts, and whether the current analysis
        is out of date (the transcripts changed since it ran). Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The transcripts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveTranscripts
      summary: >
        Saves the transcript list. One with an id is kept (and re-read if its text changed), one without is added,
        and one left out is removed. Each is split into speakers and lines; a speaker is matched to a participant by
        name. Saving an empty list retires the current analysis, so the Analyze steps lock again. Needs the token
        and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveTranscriptsRequest' }
      responses:
        '200':
          description: The transcripts as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptList' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/analysis-runs:
    post:
      operationId: startAnalysis
      summary: >
        Runs the analysis over every transcript and stores the themes as a new run; the previous run is kept but
        retired, and requirements documents of the project are flagged stale. Phase 1 is simulated and finishes
        inline (201); a real model would answer 202 and be polled. Needs the token and If-Match. 409 run_in_progress if an
        analysis is already running for the project; 503 ai_budget_reached once the monthly AI budget is spent.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: The finished run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRunResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' } # version_conflict (with current) or run_in_progress
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/themes:
    get:
      operationId: listThemes
      summary: >
        The current analysis's themes, strongest first, with the person's edits applied (a renamed title, a stage
        placement, importance, effort) next to what the analysis suggested. Optional category filter and
        quotes. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: category, in: query, required: false, schema: { type: string, enum: [pain_point, need, expectation, delight] } }
        - { name: include, in: query, required: false, schema: { type: string, enum: [quotes] } }
      responses:
        '200':
          description: The themes and the project's journey stages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /themes/{id}:
    patch:
      operationId: updateTheme
      summary: >
        Edits one theme: rename, move to a journey stage, set importance or effort, pin to the journey map. A key left out
        is untouched; null clears that edit. If-Match is the version of this theme's edits (0 when it has none), so
        edits to different themes never conflict. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThemePatch' }
      responses:
        '200':
          description: The theme as it is now, with its new edit version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Theme' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /themes/{id}/area:
    put:
      operationId: setThemeArea
      summary: >
        Files a theme under an experience category, or under none (`areaId` null). The analysis chooses an area for each theme; this is the
        person's correction. 422 `unknown_area` for an area that does not exist or is retired. Needs an owner or editor.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaId]
              properties:
                areaId: { type: [string, 'null'] }
      responses:
        '200':
          description: The theme as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Theme' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /projects/{id}/priority-overrides:
    delete:
      operationId: resetPriorityOverrides
      summary: Clears every importance and effort edit in the current analysis ("Reset all"). Pins, names and stage placements stay. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The themes after the reset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Theme' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs:
    get:
      operationId: listSpecs
      summary: Requirements documents, newest first. Filter to one project, or to stand-alone documents. Open to read as the viewer.
      parameters:
        - { name: projectId, in: query, required: false, schema: { type: string } }
        - { name: standalone, in: query, required: false, schema: { type: string, enum: ['true'] } }
      responses:
        '200':
          description: The documents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecList' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/specs:
    post:
      operationId: createSpec
      summary: >
        Gets the project's requirements document, starting it from the project's themes if it does not exist yet (a run with the
        eight fixed steps, the first already drafted and waiting for review). A project has one document: when it exists it is
        returned with 200 and nothing is drafted. 409 no_analysis if the project has no themes. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSpecRequest' }
      responses:
        '200':
          description: The document that already existed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecDetail' }
        '201':
          description: The new document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/standalone:
    post:
      operationId: createStandaloneSpec
      summary: >
        Starts a document with no research behind it, drafted from a description alone. It lives in a project of its own kind,
        so it never appears in the research projects list. Needs the token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StandaloneSpecRequest' }
      responses:
        '201':
          description: The new document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/{id}:
    get:
      operationId: getSpec
      summary: >
        One document with its themes, the eight steps (text, evidence, alternatives), the product brief and the requirements
        document built from approved steps. The ETag is the document's version. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSpec
      summary: Permanently deletes the document, its steps and, if published, its stories (a hard delete after the page's confirmation). Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/{id}/themes/{themeId}:
    put:
      operationId: setSpecTheme
      summary: Includes or excludes a theme. It applies to steps not yet started; drafted steps keep what they were written from. If-Match is the document's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: themeId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncludeThemeRequest' }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent-steps/{id}/approve:
    post:
      operationId: approveStep
      summary: >
        Approves the step under review, and starts the next one (unless draftNext is false, when only the approval is made and the next
        step is started with POST /agent-steps/{id}/draft). If-Match is the step's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { name: draftNext, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent-steps/{id}/draft:
    post:
      operationId: draftWaitingStep
      summary: Drafts a waiting step whose earlier step is approved (409 step_not_ready otherwise). If-Match is the step's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent-steps/{id}/redo:
    post:
      operationId: redoStep
      summary: Redraws a step with the person's instructions ("Revised to account for ..."), back under review. If-Match is the step's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedoRequest' }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent-steps/{id}:
    patch:
      operationId: editStep
      summary: Replaces the step's text. The step goes back under review and cannot count as approved until approved again. If-Match is the step's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditStepRequest' }
      responses:
        '200': { $ref: '#/components/responses/SpecSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/design:
    get:
      operationId: getDesign
      summary: >
        The Design step: one row per requirement of the project's published document, with its prototype link, thumbnail flag and design
        notes, and the document's own considered-and-rejected list. 404 no_board until a document is published.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The design table.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Design' }
        '404': { $ref: '#/components/responses/Error' }
  /stories/{id}/design:
    put:
      operationId: saveDesignItem
      summary: >
        Saves the prototype link, notes and (optionally) the thumbnail for one requirement. If-Match is the row's version, 0 when nothing
        has been saved yet. Leaving image out keeps the picture, null removes it. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignRequest' }
      responses:
        '200':
          description: The row as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /stories/{id}/design/capture:
    post:
      operationId: captureDesignImage
      summary: >
        Takes the thumbnail from the saved prototype link: the server opens the page in a headless browser on its side and keeps a
        960 px picture of it. Only public web pages are captured (private and internal addresses are refused). An uploaded picture is left
        alone unless `replace` is true. Needs an owner or editor. 422 `no_link` without a link, 422 `capture_failed` when the page could not
        be captured (nothing is saved), 409 `link_changed` if the link changed meanwhile, 503 `capture_unavailable` when switched off.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureRequest' }
      responses:
        '200':
          description: The row as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignItem' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /stories/{id}/design/image:
    get:
      operationId: getDesignImage
      summary: The thumbnail of one requirement's prototype, as the image itself. 404 when there is none.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The picture.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
  /measure:
    get:
      operationId: getMeasureAcross
      summary: >
        Measure, across projects: one row per requirement of the latest published requirements document of every project the caller can see (the
        same team rules as Platform Insights: workspace owners and the read-only demo viewer see every team, everyone else their teams'), with how
        we will know it worked, the latest reading and its status. Each row names its project and team and says whether the caller may change it
        (`canEdit`, true only in teams they edit in). The screen narrows by project, team and result. Open to read as the viewer.
      responses:
        '200':
          description: The projects with a published document, and their measures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasureAcross' }
        '401': { $ref: '#/components/responses/Error' }
  /projects/{id}/measure:
    get:
      operationId: getMeasure
      summary: >
        One project's measures (the same rows as in /measure, for one project): one row per requirement of the project's published document, with how we will know it worked (metric, source,
        baseline, target), the check-ins made since and the newest verdict, plus a count of each verdict. 404 no_board until a document
        is published.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The measures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measure' }
        '404': { $ref: '#/components/responses/Error' }
  /stories/{id}/measure:
    put:
      operationId: saveMeasureItem
      summary: >
        Saves how one requirement will be measured and all of its check-ins (oldest first). If-Match is the row's version, 0 when nothing
        has been saved yet. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasureRequest' }
      responses:
        '200':
          description: The row as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasureItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /specs/{id}/publish:
    post:
      operationId: publishSpec
      summary: >
        Publishes the document: every step must be approved (409 steps_not_approved otherwise). Each in-scope theme (effort 1 or 2)
        becomes a requirement and a story R1, R2 ... in the order step 5 listed them, each held-out theme (effort 3) becomes an
        open question Q1, Q2 ..., and every card starts in To Do. If-Match is the document's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '201':
          description: Published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/{id}/board-sync:
    post:
      operationId: syncBoard
      summary: >
        After publishing, brings the board in line with the document's included themes. Without apply it only previews. New
        in-scope themes get stories in To Do; stories nobody has touched whose theme is no longer included are removed; stories that
        have been moved, edited or given criteria are never removed, only noted. 409 not_published if the document is a draft.
        Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardSyncRequest' }
      responses:
        '200':
          description: What changes (or changed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardSyncPlan' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/board:
    get:
      operationId: getBoard
      summary: >
        The Stories board of a project: the cards of its most recently published requirements document, the themes they
        come from, and the last move this person made (for Undo). 404 no_board when nothing is published. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Board' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/tickets:
    get:
      operationId: listTickets
      summary: >
        The Jira tickets made from this project's requirements, newest first (the Sent to Jira list): what was sent, who sent it and
        when. The Jira connection is simulated for now, so each carries `simulated: true`. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The tickets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/themes:
    get:
      operationId: getInsightsThemes
      summary: >
        Platform Insights: themes across every analysed project (only each project's latest analysis counts), the participants
        behind each, and the recommendations drawn from them. Open to read as the viewer.
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsThemes' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/themes/{id}:
    patch:
      operationId: renamePlatformTheme
      summary: Renames a platform theme (3 to 90 characters). The old name stays as an alias. Owners and editors. 409 `duplicate_title` if another theme already has that name.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 3, maxLength: 90 }
      responses:
        '200':
          description: The theme.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformThemeRef' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: getPlatformTheme
      summary: One platform theme and where it comes from, per project, with some quotes. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The theme.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformThemeDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/themes/{id}/reviewed:
    post:
      operationId: markPlatformThemeReviewed
      summary: Clears the "New, review" flag on a platform theme the model started. Owners and editors.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: The flag is cleared. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/themes/{id}/merge:
    post:
      operationId: mergePlatformTheme
      summary: Folds this platform theme into another. Its tags, recommendations and case studies move across, its name becomes an alias of the other, and it is deleted. Owners and editors.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intoId]
              properties:
                intoId: { type: string, format: uuid }
      responses:
        '200':
          description: The theme that remains.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformThemeRef' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/themes/{id}/area:
    delete:
      operationId: clearPlatformThemeArea
      summary: >
        Owners and editors. Takes back a person's filing of a theme under an experience category: the project themes that carry that area go back to none.
        409 `not_filed_by_hand` when the area did not come from a person filing it here (the analysis's own choices are not undone).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: How many project themes were taken out of the area.
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    put:
      operationId: assignPlatformThemeArea
      summary: >
        Owners and editors. Files a platform theme that has no experience category under one, by setting it on the project themes behind it that have none.
        409 `already_assigned` when the theme already has an area: areas come from the analysis, and are not rearranged here.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaId]
              properties:
                areaId: { type: string, format: uuid }
      responses:
        '200':
          description: How many project themes were filed.
          content:
            application/json:
              schema:
                type: object
                required: [filed]
                properties:
                  filed: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /insights/merges:
    get:
      operationId: listMerges
      summary: >
        The most recent merges of one platform theme into another, newest first: those the system made on its own when a pair was clear
        (`auto`, with the confidence and the reason) and those a person made. `canUndo` is false once undone or when the theme it was folded into is gone.
      responses:
        '200':
          description: The merges.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeList' }
        '401': { $ref: '#/components/responses/Error' }
  /insights/merges/{id}/undo:
    post:
      operationId: undoMerge
      summary: >
        Takes a merge back: the theme that was folded in comes back under its old id and name, with the project themes, recommendation links and
        case-study links the merge moved. 404 when it was already undone or the theme it was folded into no longer exists; 409 `duplicate_title` when its old title is now used.
        Owners and editors.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The theme that was brought back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformThemeRef' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /insights/merge-suggestions/run:
    post:
      operationId: findMergeSuggestions
      summary: Compares every platform theme and files look-alike pairs as suggestions. Nothing is merged. Owners and editors; a model call when AI is live, else a free word check.
      responses:
        '200':
          description: How many new suggestions were filed.
          content:
            application/json:
              schema:
                type: object
                required: [added]
                properties:
                  added: { type: integer }
                  fallback: { type: string, enum: [budget, credit], description: The free word check was used because the budget or credit ran out. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/merge-suggestions/{id}/accept:
    post:
      operationId: acceptMergeSuggestion
      summary: Merges the suggested theme into the one to keep. Owners and editors.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The theme that remains.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformThemeRef' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/merge-suggestions/{id}/dismiss:
    post:
      operationId: dismissMergeSuggestion
      summary: Hides the suggestion for good (the pair is not suggested again). Owners and editors.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Dismissed. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/roadmap/rationale:
    post:
      operationId: writeRankRationales
      summary: Writes why each of the top eight ranked platform themes ranks where it does and saves it on the theme. Owners and editors; a model call when AI is live, else a plain template from the same figures.
      responses:
        '200':
          description: How many rationales were written.
          content:
            application/json:
              schema:
                type: object
                required: [written]
                properties:
                  written: { type: integer }
                  fallback: { type: string, enum: [budget, credit] }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/customers:
    get:
      operationId: getCustomers
      summary: >
        Customer profiles: the participants of every analysed project grouped by who they are (their role up to the first comma), with
        what each group raised, what happened to it and some of what they said. Open to read as the viewer.
      responses:
        '200':
          description: The groups, the largest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customers' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/journey:
    get:
      operationId: getPlatformJourney
      summary: >
        The platform journey: every analysed project's journey map folded into one. Stages with the same name are one stage, in the order
        they come along the path; each platform theme sits in the stage most of its project themes were placed in. With `workflow`, one workflow's
        journey instead: the blueprint's own stages with the research of the projects on that workflow laid over them, plus each stage's backstage and
        who is in it. Open to read as the viewer.
      parameters:
        - { name: workflow, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: The stages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformJourney' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/case-study-brief:
    get:
      operationId: getCaseBrief
      summary: >
        A project's case study material in one quick view: the problem, what people said, what was decided, the designs and the results,
        plus a prompt to paste into an AI tool to make the presentation. Sections that do not exist yet are empty or null. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The brief.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseBrief' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/storyboard:
    get:
      operationId: getStoryboard
      summary: >
        A project's research as a short deck for product leaders. The facts (who was studied, the strongest themes, a customer's words for each) are read live;
        `draft` is the text a model wrote (the headline, the problem, up to three recommended solutions with trade-offs, the recommendation and ask),
        saved once and the same for everyone, or null until an owner or editor generates it. Read-only in the app. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The storyboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storyboard' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/storyboard/generate:
    post:
      operationId: generateStoryboard
      summary: >
        Writes the storyboard's text from the project's themes, or writes it again, replacing the saved text (owners and editors). Counts as an AI call under the
        month's budget; with no model, or when the budget or credit is used up, a plain draft from the same themes is saved and `fallback` says why.
        409 `no_themes` when the project has no themes yet; 503 `ai_output_unusable` (nothing saved) when the reply could not be used.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The storyboard with its new text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storyboard' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/case-briefs:
    get:
      operationId: listCaseBriefs
      summary: >
        A case study brief for every project that qualifies: at least one requirement whose newest finding is Worked and none that needs attention.
        Newest project first. Open to read as the viewer.
      responses:
        '200':
          description: The briefs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CaseBrief' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /insights/case-studies:
    get:
      operationId: listCaseStudies
      summary: What the team shipped from research, with the platform themes each was based on. Open to read as the viewer.
      responses:
        '200':
          description: The case studies, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CaseStudy' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /stories/{id}:
    get:
      operationId: getStory
      summary: One card with its checklist. The ETag is the card's version. Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateStory
      summary: Changes a card's owner team or priority. If-Match is the card's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStoryRequest' }
      responses:
        '200': { $ref: '#/components/responses/StorySaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /integrations/jira:
    get:
      operationId: getJiraStatus
      summary: >
        Owners and editors. What the Create ticket dialog offers: whether Jira is connected (JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN and
        JIRA_PROJECT_KEY all set) and, if so, the project's name, issue types, priorities and the people a ticket can be assigned to, read from
        Jira and kept for five minutes. `problem` says why Jira could not be read. Not connected: `connected` is false and the lists are empty.
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /stories/{id}/tickets:
    post:
      operationId: createTicket
      summary: >
        Owners and editors. Makes the Jira ticket for a requirement from what was chosen in the Create ticket dialog, and keeps it as the
        record. With Jira connected the issue is made in Jira (its key and link are kept, `simulated` is false); otherwise it is simulated and
        the key follows the project's own sequence (PLAT-215, PLAT-216 ...). 409 `already_sent` when the story already has one; 422
        `not_a_requirement` for an open question; 502 when Jira refuses or cannot be reached (`jira_rejected`, `jira_refused`,
        `jira_unreachable`) or the issue was made but not recorded (`ticket_not_recorded`).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTicketRequest' }
      responses:
        '201':
          description: The ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /stories/{id}/move:
    post:
      operationId: moveStory
      summary: >
        Moves a card to a column, just before another card there or last. Only that card's row changes (the column is renumbered
        first if the neighbours are too close). Dropping a card where it already is changes nothing. Recorded for Undo. If-Match
        is the card's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveStoryRequest' }
      responses:
        '200': { $ref: '#/components/responses/StorySaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /stories/{id}/checklist:
    put:
      operationId: saveChecklist
      summary: >
        Saves the card's checklist (criteria and tasks) as a whole. An item with an id is updated in place, one without is added,
        one left out is removed. The card's progress bar counts criteria only. If-Match is the card's version. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveChecklistRequest' }
      responses:
        '200': { $ref: '#/components/responses/StorySaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /specs/{id}/undo:
    post:
      operationId: undoMove
      summary: >
        Reverses the last move this person made on the board. 404 nothing_to_undo if there is none; 409 cannot_undo if the card
        has been moved again since. Needs the token.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The card, back where it was.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/tasks:
    put:
      operationId: saveTasks
      summary: Replaces the task list (questions with their follow-ups). Needs the token and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveTasksRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProjectSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /templates:
    get:
      operationId: listTemplates
      summary: Study templates (usability, discovery, concept, blank) and the list of research methods.
      responses:
        '200':
          description: The templates, in display order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version the person was looking at (the ETag of the last read), for example "3".
      schema: { type: string }
  responses:
    StorySaved:
      description: The card as it is now, with its new version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoryDetail' }
    SpecSaved:
      description: The document as it is now.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SpecDetail' }
    ProjectSaved:
      description: Saved. The project as it is now, with its new version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectDetail' }
    VersionConflict:
      description: >
        Someone else saved first. Nothing was changed. The current version is returned so the page can offer
        Reload or Overwrite.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VersionConflict' }
    Error:
      description: >
        Every failure uses this envelope. Codes so far: unauthorized, auth_not_configured, db_unavailable,
        workspace_not_found, unauthenticated, not_invited, email_unverified, already_member, last_owner, not_found, forbidden, invalid_json, validation_failed (with a field), precondition_required, version_conflict, no_transcripts, theme_superseded, spec_published, no_analysis, step_not_ready, steps_not_approved, no_board, nothing_to_undo, cannot_undo, run_in_progress, ai_budget_reached, internal_error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      required: [status, time, version]
      properties:
        status: { type: string, enum: [ok] }
        time: { type: string }
        version: { type: string }
    DatabaseHealth:
      type: object
      required: [status, database, migrations]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [reachable] }
        migrations: { type: integer }
    VersionConflict:
      type: object
      required: [error, current]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [version_conflict] }
            message: { type: string }
        current:
          type: object
          required: [version]
          properties:
            version: { type: integer }
    StageInfo:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: object
          required: [plan, participants, transcripts, themes, storyboard, prio, requirements, design, stories]
          properties:
            plan: { $ref: '#/components/schemas/StageTab' }
            participants: { $ref: '#/components/schemas/StageTab' }
            transcripts: { $ref: '#/components/schemas/StageTab' }
            themes: { $ref: '#/components/schemas/StageTab' }
            storyboard: { $ref: '#/components/schemas/StageTab' }
            prio: { $ref: '#/components/schemas/StageTab' }
            requirements: { $ref: '#/components/schemas/StageTab' }
            design: { $ref: '#/components/schemas/StageTab' }
            stories: { $ref: '#/components/schemas/StageTab' }
    StageTab:
      type: object
      required: [enabled, hint]
      properties:
        enabled: { type: boolean }
        hint: { type: [string, 'null'] }
    ProjectDetail:
      type: object
      required: [id, name, color, template, methods, status, sessions, themes, highPriority, measurements, createdAt, version, study, description, stages, participants, tasks]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, enum: [cream, mint, yellow, coral, lavender, sky, blue, rose, peach, sand] }
        template: { type: [string, 'null'] }
        methods: { type: array, items: { type: string }, description: The research methods chosen in the test plan. }
        status: { type: string, enum: [draft, analyzed] }
        sessions: { type: integer }
        themes: { type: integer }
        highPriority: { type: integer }
        measurements: { type: integer }
        createdAt: { type: string }
        version: { type: integer }
        study:
          type: object
          required: [methods]
          properties:
            methods:
              type: array
              items: { type: string }
        description: { type: [string, 'null'], description: A short, high-level orientation for the whole project. The specifics are the questions and tasks on the Test Plan's What to ask or observe tab. }
        stages:
          type: array
          items:
            type: object
            required: [position, name]
            properties:
              position: { type: integer }
              name: { type: string }
        participants:
          type: array
          items:
            type: object
            required: [id, name, role, email, phone, sessionMinutes]
            properties:
              id: { type: string }
              name: { type: string }
              role: { type: [string, 'null'] }
              email: { type: string }
              phone: { type: [string, 'null'] }
              sessionMinutes: { type: [integer, 'null'], enum: [30, 45, 60, null], description: The planned length of the session in minutes. }
        tasks:
          type: array
          items:
            type: object
            required: [id, prompt, areaId, followUps]
            properties:
              id: { type: string }
              prompt: { type: string }
              areaId: { type: [string, 'null'], description: 'The experience category this question or task is about. Follow-ups share their parent''s.' }
              followUps:
                type: array
                items:
                  type: object
                  required: [id, prompt]
                  properties:
                    id: { type: string }
                    prompt: { type: string }
    ParticipantInput:
      type: object
      required: [name, email]
      properties:
        id: { type: [string, 'null'], description: Present for an existing participant. }
        name: { type: string }
        role: { type: [string, 'null'] }
        email: { type: string }
        phone: { type: [string, 'null'] }
        sessionMinutes: { type: [integer, 'null'], enum: [30, 45, 60, null], description: The planned length of the session in minutes. }
    SavePlanRequest:
      type: object
      required: [name, participants]
      properties:
        name: { type: string }
        methods:
          type: array
          items: { type: string }
        description: { type: [string, 'null'], description: A short, high-level orientation for the whole project, at most 2000 characters. }
        teamId: { type: string, description: 'The team to add the project to; the caller must be an editor or owner there. Optional when the caller edits in one team, or in the default team.' }
        participants:
          type: array
          description: At least one. Name and a valid email are required.
          items: { $ref: '#/components/schemas/ParticipantInput' }
    BoardStory:
      type: object
      required: [id, key, kind, title, status, position, priority, ownerTeam, summary, whyItMatters, nextStep, syncNote, theme, criteriaMet, criteriaTotal, version]
      properties:
        id: { type: string }
        key: { type: string, description: R1, R2 ... for requirements; Q1, Q2 ... for open questions. }
        kind: { type: string, enum: [requirement, open_question] }
        title: { type: string }
        status: { type: string, enum: [todo, in_progress, in_review, done] }
        position: { type: number, description: Order within the column; a card dropped between two others takes the number halfway between them. }
        priority: { type: string, enum: [low, medium, high] }
        ownerTeam: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        whyItMatters: { type: [string, 'null'] }
        syncNote: { type: [string, 'null'], description: A note when the document no longer agrees with this story (see Update board). }
        nextStep: { type: [string, 'null'] }
        theme:
          type: [object, 'null']
          required: [id, title, category, participantCount, totalParticipants]
          properties:
            id: { type: string }
            title: { type: string }
            category: { type: string }
            participantCount: { type: integer }
            totalParticipants: { type: integer }
        criteriaMet: { type: integer }
        criteriaTotal: { type: integer }
        version: { type: integer }
    ChecklistItem:
      type: object
      required: [id, kind, text, met, position]
      properties:
        id: { type: string }
        kind: { type: string, enum: [criterion, task] }
        text: { type: string }
        met: { type: boolean }
        position: { type: integer }
    StoryDetail:
      type: object
      required: [id, key, kind, title, status, position, priority, ownerTeam, summary, whyItMatters, nextStep, syncNote, theme, criteriaMet, criteriaTotal, version, specId, checklist]
      properties:
        id: { type: string }
        key: { type: string }
        kind: { type: string, enum: [requirement, open_question] }
        title: { type: string }
        status: { type: string, enum: [todo, in_progress, in_review, done] }
        position: { type: number }
        priority: { type: string, enum: [low, medium, high] }
        ownerTeam: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        whyItMatters: { type: [string, 'null'] }
        syncNote: { type: [string, 'null'], description: A note when the document no longer agrees with this story (see Update board). }
        nextStep: { type: [string, 'null'] }
        theme:
          type: [object, 'null']
          required: [id, title, category, participantCount, totalParticipants]
          properties:
            id: { type: string }
            title: { type: string }
            category: { type: string }
            participantCount: { type: integer }
            totalParticipants: { type: integer }
        criteriaMet: { type: integer }
        criteriaTotal: { type: integer }
        version: { type: integer }
        specId: { type: string }
        checklist:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
    InsightsThemes:
      type: object
      required: [projects, totalParticipants, summary, themes, recommendations, mergeSuggestions]
      properties:
        mergeSuggestions:
          type: array
          description: Pairs of platform themes that look like duplicates, waiting for a person to accept (merge) or dismiss, most confident first.
          items: { $ref: '#/components/schemas/MergeSuggestion' }
        projects:
          type: array
          description: Projects with a current analysis, oldest first.
          items:
            type: object
            required: [id, name, color, participants]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              color: { type: string }
              participants: { type: integer }
        totalParticipants: { type: integer }
        summary:
          type: object
          description: Counts for the cards above the list.
          required: [recurring, opportunities, needsAttention, worked]
          properties:
            recurring: { type: integer, description: 'Pain points, needs and expectations raised in two or more projects.' }
            opportunities: { type: integer, description: Themes raised again and again that no requirement addresses. }
            needsAttention: { type: integer }
            worked: { type: integer }
        themes:
          type: array
          description: Ranked by reach, widest first (most projects, then most participants).
          items:
            type: object
            required: [id, title, category, needsReview, area, areaFiledByHand, origin, teamSessions, participantCount, projectCount, status, trend, trendSeries, opportunity, requirements, sources, summary, matches, priority, rationale, aliases]
            properties:
              aliases: { type: array, items: { type: string }, description: 'Old names, kept when the theme was renamed or another was merged into it.' }
              rationale: { type: [string, 'null'], description: 'Why it ranks where it does, written on request; null until then.' }
              priority:
                type: [object, 'null']
                description: Suggested roadmap position among problems and needs; null for delights.
                required: [rank, score]
                properties:
                  rank: { type: integer, minimum: 1 }
                  score: { type: integer, description: 'Reach (60% people, 40% projects) times what became of it, with a bump for opportunities.' }
              matches:
                type: array
                description: The project themes filed under it (up to 12), with how each was matched.
                items:
                  type: object
                  required: [themeTitle, projectName, method, confidence, reason]
                  properties:
                    themeTitle: { type: string }
                    projectName: { type: string }
                    method: { type: string, enum: [auto, manual] }
                    confidence: { type: [number, 'null'] }
                    reason: { type: [string, 'null'], description: 'The model''s one-line reason, when it made the match.' }
              id: { type: string, format: uuid }
              title: { type: string }
              category: { type: string, enum: [pain_point, need, expectation, delight] }
              needsReview: { type: boolean, description: 'True for a platform theme the model started that nobody has marked reviewed yet.' }
              area:
                type: [object, 'null']
                description: The experience category most of its project themes are filed under; null when there is none (shown as Unassigned).
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
              origin: { type: string, enum: [customer, team, both], description: Where it was heard; participantCount and projectCount count customers only. }
              teamSessions: { type: integer, description: How many team conversations it came up in. }
              areaFiledByHand: { type: boolean, description: 'True when a person filed the theme under its area from the table, so Undo is offered. The analysis''s own choices are not undone there.' }
              participantCount: { type: integer }
              projectCount: { type: integer }
              status:
                type: string
                enum: [not_addressed, in_progress, too_early, worked, needs_attention]
                description: What became of it. not_addressed means no requirement was written; the rest follow the newest finding on its requirements (needs_attention beats worked beats too_early; in_progress means a requirement with no finding yet).
              trendSeries:
                type: array
                description: The share (0 to 1) of each project's participants who raised it, oldest project first; empty when there is no trend.
                items: { type: number }
              trend:
                type: [string, 'null']
                enum: [new, growing, steady, fading, null]
                description: How its reach changed between projects, null when there is only one project.
              opportunity: { type: boolean, description: 'Not addressed, not a delight, and raised in two or more projects or by three or more people.' }
              summary: { type: [string, 'null'], description: 'What the theme means, as the project where the most people raised it described it. null when no project wrote one.' }
              requirements:
                type: array
                description: The requirements written for it. The same requirement in several projects is one entry, with how many projects wrote it and the strongest newest finding among them.
                items:
                  type: object
                  required: [title, projectCount, result]
                  properties:
                    title: { type: string }
                    projectCount: { type: integer }
                    result:
                      type: [string, 'null']
                      enum: [worked, needs_attention, too_early, null]
              sources:
                type: array
                items:
                  type: object
                  required: [projectId, participantCount]
                  properties:
                    projectId: { type: string, format: uuid }
                    participantCount: { type: integer }
        recommendations:
          type: array
          items:
            type: object
            required: [id, title, why, priority, themes, participantCount, projectCount]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              why: { type: [string, 'null'] }
              priority: { type: string, enum: [low, medium, high] }
              themes:
                type: array
                items:
                  type: object
                  required: [id, title]
                  properties:
                    id: { type: string, format: uuid }
                    title: { type: string }
              participantCount: { type: integer }
              projectCount: { type: integer }
    Customers:
      type: object
      required: [totalParticipants, groups]
      properties:
        totalParticipants: { type: integer }
        groups:
          type: array
          items:
            type: object
            required: [key, name, participantCount, projectCount, projects, roles, themes, quotes, opportunities]
            properties:
              key: { type: string }
              name: { type: string }
              participantCount: { type: integer }
              projectCount: { type: integer }
              projects:
                type: array
