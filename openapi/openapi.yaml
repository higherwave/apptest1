    CaseBrief:
      type: object
      required: [projectId, projectName, template, sessions, participants, problem, evidence, decisions, designs, results, outcome, prompt]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        template: { type: [string, 'null'] }
        sessions: { type: integer }
        participants: { type: integer }
