      required: [key, name, description, what, jtbd, outcomes, methods, tasks]
      properties:
        key: { type: string, enum: [usability, discovery, concept, blank] }
        name: { type: string }
        description: { type: [string, 'null'] }
        what: { type: string }
        jtbd:
          type: object
          required: [when, want, so]
          properties:
            when: { type: string }
            want: { type: string }
            so: { type: string }
        outcomes:
          type: array
          items: { type: string }
        methods:
          type: array
          items: { type: string }
        tasks:
          type: array
          items:
            type: object
            required: [prompt, followUps]
            properties:
              prompt: { type: string }
              followUps:
                type: array
                items: { type: string }
    CreateProjectRequest:
      type: object
      required: [name, participants]
      properties:
        name: { type: string }
        templateKey: { type: string, enum: [usability, discovery, concept, blank], description: Optional; the test plan page no longer offers templates, so new projects use blank. }
        methods:
          type: array
          items: { type: string }
        description: { type: [string, 'null'], description: A short, high-level orientation for the whole project, at most 2000 characters. }
        participants:
          type: array
          description: At least one. Name and a valid email are required.
          items: { $ref: '#/components/schemas/ParticipantInput' }
    ProjectList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectSummary' }
        next_cursor:
          type: [string, 'null']
    ProjectSummary:
      type: object
      required: [id, name, color, template, methods, status, sessions, themes, highPriority, measurements, createdAt, version, teamId, teamName]
      properties:
        id: { type: string }
        name: { type: string }
        color:
          type: string
          description: A tint token name; the page maps it to var(--at-tint-<color>).
          enum: [cream, mint, yellow, coral, lavender, sky, blue, rose, peach, sand]
        template: { type: [string, 'null'] }
        methods: { type: array, items: { type: string }, description: The research methods chosen in the test plan. }
        status:
          type: string
          description: Derived, not stored. draft means the current analysis has no themes.
          enum: [draft, analyzed]
        sessions: { type: integer, description: Transcripts in the project. }
        themes: { type: integer, description: Themes in the current analysis. }
        highPriority: { type: integer, description: Themes whose suggested priority is high. }
        measurements: { type: integer, description: 'Requirements with a metric or a finding recorded in the Measure step.' }
        createdAt: { type: string }
        version: { type: integer }
        teamId: { type: [string, 'null'], description: The team the project belongs to. }
        teamName: { type: [string, 'null'] }
    DesignItem:
      type: object
      required: [storyId, key, title, priority, summary, whyItMatters, theme, prototypeUrl, notes, hasImage, imageSource, version]
      properties:
        storyId: { type: string }
        key: { type: string, description: 'R1, R2 ...' }
        title: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        summary: { type: [string, 'null'] }
        whyItMatters: { type: [string, 'null'] }
        theme:
          type: [object, 'null']
          required: [title, participantCount, totalParticipants]
          properties:
            title: { type: string }
            participantCount: { type: integer }
            totalParticipants: { type: integer }
        prototypeUrl: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        hasImage: { type: boolean }
        imageSource: { type: [string, 'null'], enum: [upload, capture, null], description: 'Who made the picture: a person (upload) or the server from the link (capture). Null without a picture.' }
        version: { type: integer, description: '0 when nothing has been saved for this requirement yet.' }
    Design:
      type: object
      required: [specId, specName, projectId, captureEnabled, decisions, items]
      properties:
        specId: { type: string }
        specName: { type: string }
        projectId: { type: string }
        captureEnabled: { type: boolean, description: 'False when thumbnail capture is switched off on this deployment (DESIGN_CAPTURE=false).' }
        decisions:
          type: object
          required: [reasoning, alternatives]
          properties:
            reasoning: { type: [string, 'null'] }
            alternatives:
              type: array
              items:
                type: object
                required: [title, reason]
                properties:
                  title: { type: string }
                  reason: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/DesignItem' }
    CaptureRequest:
      type: object
      properties:
        replace: { type: boolean, description: 'Let the capture replace a picture a person uploaded.' }
    DesignRequest:
      type: object
      properties:
        prototypeUrl: { type: [string, 'null'], description: 'A link starting with http:// or https://.' }
        notes: { type: [string, 'null'] }
        image:
          type: [object, 'null']
          description: A small downscaled picture, base64 (at most about 600 KB decoded).
          required: [type, data]
          properties:
            type: { type: string, enum: [image/jpeg, image/png, image/webp] }
            data: { type: string }
    Checkin:
      type: object
      required: [on, value, verdict, note]
      properties:
        on: { type: string, description: 'The day of the check-in, YYYY-MM-DD.' }
        value: { type: string, maxLength: 2000, description: 'What was seen, in words or numbers; it can run to a few sentences.' }
        verdict: { type: string, enum: [worked, needs_attention, too_early] }
        note: { type: [string, 'null'] }
    MeasureItem:
      type: object
      required: [storyId, key, title, priority, summary, whyItMatters, metric, source, baseline, target, metricKind, detail, comparison, valueA, valueB, unit, trend, checkins, result, version]
      properties:
        storyId: { type: string }
        key: { type: string, description: 'R1, R2 ...' }
        title: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        summary: { type: [string, 'null'] }
        whyItMatters: { type: [string, 'null'] }
        metric: { type: [string, 'null'], description: How we will know it worked. }
        source:
          type: [string, 'null']
          enum: [telemetry, kpi, support_tickets, research, other, null]
        baseline: { type: [string, 'null'] }
        target: { type: [string, 'null'] }
        metricKind: { type: [string, 'null'], enum: [tickets, adoption, engagement, time_to_value, retention, feedback, other, null], description: 'What is measured, in the sentence the row is entered as. Null on a row saved before the sentence existed (it then has only metric, baseline and target).' }
        detail: { type: [string, 'null'], description: 'Which tickets, which adoption: free text, completing the sentence.' }
        comparison: { type: [string, 'null'], enum: [change, below, above, between, reach, null], description: 'go from (valueA to valueB), stay below, rise above, stay between (valueA and valueB) or reach valueA.' }
        valueA: { type: [string, 'null'] }
        valueB: { type: [string, 'null'] }
        unit: { type: [string, 'null'], description: 'The unit or period, for example a month or %.' }
        trend:
          type: [array, 'null']
          items: { type: number }
          description: 'A short series of readings, oldest first, for a small chart. Read-only: sample data in the demo, to be filled by a connected data source later.'
        checkins:
          type: array
          description: 'Oldest first. A requirement has one reading today, the latest, with its status (older rows may have several).'
          items: { $ref: '#/components/schemas/Checkin' }
        result:
          type: [string, 'null']
          enum: [worked, needs_attention, too_early, null]
          description: The newest check-in's verdict, null before the first one.
        version: { type: integer, description: '0 when nothing has been saved for this requirement yet.' }
    MeasureAcrossItem:
      allOf:
        - $ref: '#/components/schemas/MeasureItem'
        - type: object
          required: [projectId, projectName, teamId, teamName, canEdit]
          properties:
            projectId: { type: string }
            projectName: { type: string }
            teamId: { type: [string, 'null'] }
            teamName: { type: [string, 'null'] }
            canEdit: { type: boolean, description: 'True when the caller edits in this project''s team; the row is read-only for them otherwise.' }
    MeasureAcross:
      type: object
      required: [projects, items]
      properties:
        projects:
          type: array
          items:
            type: object
            required: [id, name, teamId, teamName, canEdit]
            properties:
              id: { type: string }
              name: { type: string }
              teamId: { type: [string, 'null'] }
              teamName: { type: [string, 'null'] }
              canEdit: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/MeasureAcrossItem' } }
    Measure:
      type: object
      required: [specId, specName, projectId, summary, items]
      properties:
        specId: { type: string }
        specName: { type: string }
        projectId: { type: string }
        summary:
          type: object
          required: [total, worked, needsAttention, tooEarly, notMeasured]
          properties:
            total: { type: integer }
            worked: { type: integer }
            needsAttention: { type: integer }
            tooEarly: { type: integer }
            notMeasured: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/MeasureItem' }
    MeasureRequest:
      type: object
      required: [checkins]
      properties:
        metricKind: { type: [string, 'null'], enum: [tickets, adoption, engagement, time_to_value, retention, feedback, other, null], description: 'When sent, metric, baseline and target are written from the sentence parts below.' }
        detail: { type: [string, 'null'] }
        comparison: { type: [string, 'null'], enum: [change, below, above, between, reach, null] }
        valueA: { type: [string, 'null'] }
        valueB: { type: [string, 'null'] }
        unit: { type: [string, 'null'] }
        metric: { type: [string, 'null'] }
        source:
          type: [string, 'null']
          enum: [telemetry, kpi, support_tickets, research, other, null]
        baseline: { type: [string, 'null'] }
        target: { type: [string, 'null'] }
        checkins:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/Checkin' }
    Storyboard:
      type: object
      required: [facts, draft]
      properties:
        facts:
          type: object
          required: [projectName, participants, sessions, roles, tasks, when, themes, themeCount]
          properties:
            projectName: { type: string }
            participants: { type: integer }
            sessions: { type: integer }
            roles:
              type: array
              items:
                type: object
                required: [role, count]
                properties: { role: { type: string }, count: { type: integer } }
            tasks: { type: array, items: { type: string }, description: 'The top-level questions and tasks of the test plan (up to six).' }
            when:
              type: [object, 'null']
              description: First and last session date of the participants, or null when none has a date.
              required: [from, to]
              properties: { from: { type: string, format: date }, to: { type: string, format: date } }
            themes:
              type: array
              description: The strongest themes (up to eight), most important first. The deck shows the first five.
              items:
                type: object
                required: [id, title, category, participants, totalParticipants, quote]
                properties:
                  id: { type: string }
                  title: { type: string }
                  category: { type: string }
                  participants: { type: integer }
                  totalParticipants: { type: integer }
                  quote:
                    type: [object, 'null']
                    description: A customer's own words, or null.
                    required: [text, who]
                    properties: { text: { type: string }, who: { type: string } }
            themeCount: { type: integer, description: 'All the project''s themes, for "Show all themes".' }
        draft:
          type: [object, 'null']
          description: The saved text, or null until generated.
          required: [headline, problem, solutions, recommendation, source, generatedAt]
          properties:
            headline: { type: string }
            problem: { type: string }
            solutions:
              type: array
              items:
                type: object
                required: [name, description, themes, benefit, cost, risk, giveUp, alternatives]
                properties:
                  name: { type: string }
                  description: { type: string }
                  themes:
                    type: array
                    description: The themes it answers, by name.
                    items:
                      type: object
                      required: [id, title]
                      properties: { id: { type: string }, title: { type: string } }
                  benefit: { type: string }
                  cost: { type: string }
                  risk: { type: string }
                  giveUp: { type: string }
                  alternatives: { type: string }
            recommendation:
              type: object
              required: [direction, decision, nextStep]
              properties: { direction: { type: string }, decision: { type: string }, nextStep: { type: string } }
            source: { type: string, enum: [model, template], description: 'template is the plain draft made without the AI model.' }
            generatedAt: { type: string, format: date-time }
        fallback: { type: string, enum: [budget, credit], description: 'Set on a generate that fell back to the plain draft because the month''s budget or the account''s credit was used up.' }
    AiStatus:
      type: object
      required: [mode, enabled]
      properties:
        mode: { type: string, enum: [live, simulated] }
        enabled: { type: boolean, description: 'False when the AI_ENABLED=false kill switch is set.' }
        budgetUsd: { type: number }
        spentUsd: { type: number }
        spendLevel: { type: string, enum: [ok, half, high, reached], description: 'How far through the month''s budget the spend is: half from 50%, high from 80%, reached at 100%. Sent with budgetUsd and spentUsd.' }
        month: { type: string, description: 'The month the spend counts, as YYYY-MM (UTC).' }
        byTeam:
          type: array
          description: 'Owners only, with the spend. Where this month''s spend went, by the team of the project each call was for; a call for no one project has no team. One budget governs the whole workspace.'
          items:
            type: object
            required: [teamId, name, spentUsd]
            properties:
              teamId: { type: [string, 'null'] }
              name: { type: [string, 'null'] }
              spentUsd: { type: number }
        problems:
          type: array
          description: The most recent problems with model calls in the past 30 days (up to 10, newest first). Only owners and editors receive it, and only when there are some.
          items:
            type: object
            required: [at, purpose, code, message, detail]
            properties:
              at: { type: string, format: date-time }
              purpose: { type: string, description: 'analysis, spec_step, theme_match or storyboard.' }
              code: { type: string, description: 'For example ai_output_unusable, ai_credit_exhausted or ai_budget_reached.' }
              message: { type: string }
              detail: { type: [string, 'null'], description: 'What was wrong with the reply, or what the app did instead. Never research text.' }
    NotificationPreferences:
      type: object
      required: [email, receives, digestEnabled, timeZone, mailConfigured]
      properties:
        email: { type: string, description: 'Where the reminder is sent.' }
        receives: { type: boolean, description: 'True for owners and editors.' }
        digestEnabled: { type: boolean }
        timeZone: { type: [string, 'null'] }
        mailConfigured: { type: boolean, description: 'False when this deployment has no email sender set up.' }
    Me:
      type: object
      required: [userId, email, displayName, avatarUrl, workspaceId, workspaceName, role, via, external, signInAvailable, rolesManagedBySso, teamsManagedBySso, teams]
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'], description: 'The picture from the sign-in provider (Google, or the company sign-in), shown in the header. Null when there is none.' }
        workspaceId: { type: string }
        workspaceName: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        via: { type: string, enum: [session, token, open, anonymous], description: 'How this request was let in.' }
        external: { type: boolean, description: 'True for an external member (outside counsel, a partner): refused everywhere except their own details and the launches they are asked to review (403 `external_member`).' }
        signInAvailable: { type: boolean, description: 'True when sign-in (Google or the company single sign-on) is configured on this deployment.' }
        rolesManagedBySso: { type: boolean, description: 'True when roles come from sign-in groups: inviting, changing roles and removing are then refused with 409 `managed_by_sso`.' }
        teamsManagedBySso: { type: boolean, description: 'True when SSO_TEAM_GROUP_PREFIX is set: people''s places in every team but the default one come from their sign-in groups, and changing them in Admin is refused with 409 `managed_by_sso`.' }
        teams:
          type: array
          description: 'The teams the person belongs to, with their role in each. A leader (workspace owner) sees every team''s projects whether or not they belong to it.'
          items:
            type: object
            required: [id, name, role]
            properties:
              id: { type: string }
              name: { type: string }
              role: { type: string, enum: [owner, editor, viewer] }
    CaptureHealth:
      type: object
      required: [ok, enabled, node, platform, arch, checkedAt, steps]
      properties:
        ok: { type: boolean }
        enabled: { type: boolean, description: 'False when DESIGN_CAPTURE=false.' }
        node: { type: string }
        platform: { type: string }
        arch: { type: string }
        checkedAt: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [name, ok, ms]
            properties:
              name: { type: string }
              ok: { type: boolean }
              ms: { type: integer }
              detail: { type: string }
    Area:
      type: object
      required: [id, name, definition, aliases, retired, mergedInto, usage, version]
      properties:
        id: { type: string }
        name: { type: string }
        definition: { type: [string, 'null'], description: 'What is in and out of this area, in a line.' }
        aliases:
          type: array
          items: { type: string }
        retired: { type: boolean }
        mergedInto: { type: [string, 'null'], description: The area this one was merged into, when it was. }
        usage:
          type: object
          required: [tasks, themes]
          properties:
            tasks: { type: integer }
            themes: { type: integer, description: Themes of the current analyses filed under this area. }
        version: { type: integer }
    AreaProposal:
      type: object
      required: [key, name, themes, participants, projects]
      properties:
        key: { type: string, description: The word the group shares; the same suggestion has the same key each time. }
        name: { type: string }
        themes:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string }
              title: { type: string }
        participants: { type: integer }
        projects: { type: integer }
    AreaProposalList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AreaProposal' }
    AcceptAreaProposalRequest:
      type: object
      required: [key]
      properties:
        key: { type: string }
        name: { type: [string, 'null'], description: A different name than the one suggested. }
    AcceptedAreaProposal:
      type: object
      required: [areaId, name, filed]
      properties:
        areaId: { type: string }
        name: { type: string }
        filed: { type: integer }
    DismissAreaProposalRequest:
      type: object
      required: [key]
      properties:
        key: { type: string }
    AreaList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Area' }
    CreateAreaRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        definition: { type: [string, 'null'] }
        aliases:
          type: array
          items: { type: string }
        force: { type: boolean, description: Add it even though it resembles an existing area. }
    UpdateAreaRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        definition: { type: [string, 'null'] }
        aliases:
          type: array
          items: { type: string }
    MergeAreaRequest:
      type: object
      required: [intoId]
      properties:
        intoId: { type: string }
    SignInOptionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, enum: [google, oidc] }
              label: { type: string, description: 'Completes "Continue with ...".' }
    Member:
      type: object
      required: [id, email, displayName, role, status, avatarUrl, external]
      properties:
        id: { type: string, description: 'The membership id.' }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        status: { type: string, enum: [active, invited], description: 'Invited until their first sign-in.' }
        avatarUrl: { type: string, nullable: true }
        external: { type: boolean, description: 'From outside the company. An external member is a viewer with limited access.' }
    Ticket:
      type: object
      required: [id, storyId, storyKey, jiraKey, project, issueType, summary, description, priority, assignee, labels, points, simulated, jiraUrl, createdBy, createdAt]
      properties:
        id: { type: string }
        storyId: { type: [string, 'null'], description: The story it was made from; null if a later board update removed that story. }
        storyKey: { type: string, description: R1, R2 ... as it was when sent. }
        jiraKey: { type: string, description: 'For example KAN-12 from Jira, or PLAT-215 while simulated.' }
        project: { type: string, description: 'The Jira project, as "PLAT · Platform".' }
        issueType: { type: string }
        summary: { type: string }
        description: { type: string }
        priority: { type: string }
        assignee: { type: string }
        labels: { type: string }
        points: { type: [string, 'null'] }
        simulated: { type: boolean, description: 'True when the key was made here, not by Jira (no Jira connection).' }
        jiraUrl: { type: [string, 'null'], description: 'The address of the issue in Jira; null for a simulated ticket.' }
        createdBy:
          type: [object, 'null']
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
    TicketList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
    CreateTicketRequest:
      type: object
      required: [issueType, summary, priority]
      properties:
        project: { type: string, description: 'Simulation only: code and name, for example "PLAT · Platform". A connected Jira uses its one project.' }
        issueType: { type: string, description: 'An issue type of the Jira project (Story, Task ...).' }
        summary: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 20000 }
        priority: { type: string, maxLength: 40 }
        assignee: { type: string, maxLength: 80 }
        assigneeId: { type: [string, 'null'], maxLength: 80, description: 'The Jira account to assign to; null leaves it unassigned.' }
        labels: { type: string, maxLength: 200 }
        points: { type: [string, 'null'], maxLength: 6 }
    JiraStatus:
      type: object
      required: [connected, siteUrl, projectKey, projectName, issueTypes, priorities, assignees, problem]
      properties:
        connected: { type: boolean }
        siteUrl: { type: [string, 'null'] }
        projectKey: { type: [string, 'null'] }
        projectName: { type: [string, 'null'] }
        issueTypes: { type: array, items: { type: string } }
        priorities: { type: array, items: { type: string } }
        assignees:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        problem: { type: [string, 'null'], description: 'Why Jira could not be read, when it could not.' }
    WorkflowBackstage:
      type: object
      required: [id, kind, name, owner]
      properties:
        id: { type: string }
        kind: { type: string, enum: [Team, System, Process] }
        name: { type: string }
        owner: { type: [string, 'null'], description: 'Who owns it, for example a team name.' }
    WorkflowStage:
      type: object
      required: [id, position, name, good, signal, handoff, backstage]
      properties:
        id: { type: string }
        position: { type: integer }
        name: { type: string }
        good: { type: [string, 'null'], description: 'What "good" looks like at this stage.' }
        signal: { type: [string, 'null'], description: The signal to watch. }
        handoff: { type: [string, 'null'], description: The handoff out of the stage. }
        backstage:
          type: array
          items: { $ref: '#/components/schemas/WorkflowBackstage' }
    Workflow:
      type: object
      required: [id, name, description, version, projectCount, stages]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        version: { type: integer }
        projectCount: { type: integer, description: Projects that are on this workflow. }
        stages:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStage' }
    WorkflowList:
      type: object
      required: [data, sampleMissing]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Workflow' }
        sampleMissing: { type: boolean, description: True while the Anchor CX example workflow is not in the workspace yet (the button that adds it is offered). }
    WorkflowRequest:
      type: object
      required: [name, stages]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 400 }
        stages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required: [name]
            properties:
              id: { type: [string, 'null'], description: 'Send the id of a stage that exists to change it in place; leave it out to add one.' }
              name: { type: string, maxLength: 80 }
              good: { type: [string, 'null'], maxLength: 300 }
              signal: { type: [string, 'null'], maxLength: 300 }
              handoff: { type: [string, 'null'], maxLength: 300 }
              backstage:
                type: array
                maxItems: 12
                items:
                  type: object
                  required: [kind, name]
                  properties:
                    id: { type: [string, 'null'] }
                    kind: { type: string, enum: [Team, System, Process] }
                    name: { type: string, maxLength: 100 }
                    owner: { type: [string, 'null'], maxLength: 100 }
    ProjectBlueprint:
      type: object
      required: [workflow, stages]
      properties:
        workflow:
          type: [object, 'null']
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        stages:
          type: array
          items:
            type: object
            required: [position, name, workflowStageId, workflowStage]
            properties:
              position: { type: integer }
              name: { type: string }
              workflowStageId: { type: [string, 'null'] }
              workflowStage:
                anyOf:
                  - { $ref: '#/components/schemas/WorkflowStage' }
                  - { type: 'null' }
    SetProjectWorkflowRequest:
      type: object
      required: [workflowId]
      properties:
        workflowId: { type: [string, 'null'] }
    MapStageRequest:
      type: object
      required: [position, workflowStageId]
      properties:
        position: { type: integer, minimum: 0 }
        workflowStageId: { type: [string, 'null'] }
    UsageRow:
      type: object
      required: [key, label, used, limit, unit, level, note]
      properties:
        key: { type: string, description: 'For example database.' }
        label: { type: string }
        used: { type: [integer, 'null'], description: 'In the unit; null when it could not be read.' }
        limit: { type: [integer, 'null'], description: 'In the unit; null when no limit is set.' }
        unit: { type: string, enum: [bytes] }
        level: { type: string, enum: [ok, half, high, reached], description: 'half from 50% of the limit, high from 80%, reached at 100%.' }
        note: { type: string }
    UsageList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UsageRow' }
    AuditEntry:
      type: object
      required: [id, createdAt, actor, group, entity, entityId, verb, before, after, team]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        team:
          type: [object, 'null']
          description: The team the change was about (a project's team, or the team itself), when it has one.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        actor:
          type: [object, 'null']
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        group: { type: string, enum: [members, teams, reviewers, categories, projects, workflows, jira] }
        entity: { type: string, description: 'What changed, for example insights.feature_areas.' }
        entityId: { type: [string, 'null'] }
        verb: { type: string, description: 'For example created, edited, merged, retired.' }
        before: { description: 'What it was, when the change replaced something.' }
        after: { description: 'What it became.' }
    AuditPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextCursor: { type: [string, 'null'] }
    MemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Member' }
    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        external: { type: boolean, description: 'Invite from outside the company. Needs role viewer (409 `external_needs_viewer` otherwise).' }
    TeamList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    Team:
      type: object
      required: [id, name, isDefault, members, projects]
      properties:
        id: { type: string }
        name: { type: string }
        isDefault: { type: boolean, description: The team new people and new projects land in when no other is named. It cannot be deleted. }
        members:
          type: array
          items:
            type: object
            required: [memberId, email, displayName, role]
            properties:
              memberId: { type: string, description: The id from the Members list. }
              email: { type: string }
              displayName: { type: string }
              role: { type: string, enum: [owner, editor, viewer] }
        projects:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
    TeamNameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: 1 to 60 characters. }
    AddReviewerRequest:
      type: object
      required: [memberId, steps, teams, role]
      properties:
        memberId: { type: string, description: 'The membership id from the Members list.' }
        steps: { type: array, items: { type: string, enum: [product_leadership, sales, legal, documentation, marketing, final_decision] } }
        teams: { description: 'The string "all" (every team, including teams made later), or a list of team ids.', oneOf: [{ type: string, enum: [all] }, { type: array, items: { type: string } }] }
        role: { type: string, enum: [primary, alternate] }
    TeamLaunchStepsRequest:
      type: object
      required: [used]
      properties:
        used:
          type: object
          description: Optional steps only (not final_decision).
          additionalProperties: { type: boolean }
    ReviewerPerson:
      type: object
      required: [userId, name, email]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
    ReviewerAssignment:
      type: object
      required: [id, userId, email, displayName, external, step, teamId, teamName, role]
      properties:
        id: { type: string }
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        external: { type: boolean }
        step: { type: string, enum: [product_leadership, sales, legal, documentation, marketing, final_decision] }
        teamId: { type: [string, 'null'], description: 'Null means all teams.' }
        teamName: { type: [string, 'null'] }
        role: { type: string, enum: [primary, alternate] }
    CoverageCell:
      type: object
      required: [step, state, scope, primary, alternate]
      properties:
        step: { type: string }
        state: { type: string, enum: [covered, gap, not_used] }
        scope: { type: [string, 'null'], enum: [team, all, null], description: 'Which assignments decide: the team''s own, or the all-teams ones; null when nobody is assigned.' }
        primary: { type: array, items: { $ref: '#/components/schemas/ReviewerPerson' } }
        alternate: { type: array, items: { $ref: '#/components/schemas/ReviewerPerson' } }
    ReviewerTeam:
      type: object
      required: [id, name, isDefault, stepsOff, steps]
      properties:
        id: { type: string }
        name: { type: string }
        isDefault: { type: boolean }
        stepsOff: { type: array, items: { type: string }, description: 'The optional steps this team does not use.' }
        steps: { type: array, items: { $ref: '#/components/schemas/CoverageCell' } }
    ReviewerOverview:
      type: object
      required: [steps, assignments, teams]
      properties:
        steps:
          type: array
          items:
            type: object
            required: [key, label, optional]
            properties:
              key: { type: string }
              label: { type: string }
              optional: { type: boolean, description: 'False for the final decision, which every team uses.' }
        assignments: { type: array, items: { $ref: '#/components/schemas/ReviewerAssignment' } }
        teams: { type: array, items: { $ref: '#/components/schemas/ReviewerTeam' } }
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [owner, editor, viewer] }
    ChangeMemberRequest:
      type: object
      properties:
        role: { type: string, enum: [owner, editor, viewer] }
        external: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
