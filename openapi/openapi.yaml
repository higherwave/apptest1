openapi: 3.1.0
info:
  title: Signal Flow API
  version: 0.1.0
  description: >
    The spec is the contract: handlers are checked against it (server/app.test.ts), and the MCP server
    will check that every page binds to an operation listed here. Phase 2 covers the shell only.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness. Never touches the database.
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health/db:
    get:
      operationId: getDatabaseHealth
      summary: Reaches the database. Needs the same access as data routes, because it can wake a suspended compute.
      responses:
        '200':
          description: The database is reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseHealth' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getMe
      summary: >
        The user and workspace this request acts as. Without a token the role is viewer (the demo is read-only);
        with the token it is the demo owner.
      responses:
        '200':
          description: The current context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects:
    get:
      operationId: listProjects
      summary: >
        Research projects in the workspace, with the figures shown on a project card. Open to anyone for
        reading (viewer role); cached for a minute so repeated requests do not reach the database.
      responses:
        '200':
          description: The projects, newest first, then by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      summary: >
        Creates a project with its test plan, journey stages, participants and the template's starter tasks,
        in one transaction. Needs the token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: The new project, as it appears on a project card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}:
    get:
      operationId: getProject
      summary: >
        One project with its test plan, journey stages, participants and tasks. The ETag is the project's
        version; send it back in If-Match when saving. Open to read as the viewer; cached for a minute.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      summary: >
        Permanently deletes a project and everything under it (a hard delete; the page asks for confirmation first).
        The audit log keeps the name, actor and time. Needs the token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/stage:
    get:
      operationId: getProjectStage
      summary: >
        Which steps of the project are open, and the hint to show for a locked one. The server decides, so the
        page never re-derives these rules; write endpoints enforce the same ones.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One entry per step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/study:
    put:
      operationId: saveStudy
      summary: Saves the project name and test plan (what, job to be done, outcomes, methods). Needs the token and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePlanRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProjectSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/participants:
    put:
      operationId: saveParticipants
      summary: >
        Saves the participant list. A participant with an id is updated in place (so transcript speakers matched
        to it stay matched), one without is added, and one left out is removed. Needs the token and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveParticipantsRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProjectSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/transcripts:
    get:
      operationId: getTranscripts
      summary: >
        The project's transcripts with their text, speakers and line counts, and whether the current analysis
        is out of date (the transcripts changed since it ran). Open to read as the viewer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The transcripts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveTranscripts
      summary: >
        Saves the transcript list. One with an id is kept (and re-read if its text changed), one without is added,
        and one left out is removed. Each is split into speakers and lines; a speaker is matched to a participant by
        name. Saving an empty list retires the current analysis, so the Analyze steps lock again. Needs the token
        and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveTranscriptsRequest' }
      responses:
        '200':
          description: The transcripts as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptList' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/analysis-runs:
    post:
      operationId: startAnalysis
      summary: >
        Runs the analysis over every transcript and stores the themes as a new run; the previous run is kept but
        retired, and requirements documents of the project are flagged stale. Phase 1 is simulated and finishes
        inline (201); a real model would answer 202 and be polled. Needs the token and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: The finished run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRunResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}/tasks:
    put:
      operationId: saveTasks
      summary: Replaces the task list (questions with their follow-ups). Needs the token and If-Match.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveTasksRequest' }
      responses:
        '200': { $ref: '#/components/responses/ProjectSaved' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /templates:
    get:
      operationId: listTemplates
      summary: Study templates (usability, discovery, concept, blank) and the list of research methods.
      responses:
        '200':
          description: The templates, in display order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version the person was looking at (the ETag of the last read), for example "3".
      schema: { type: string }
  responses:
    ProjectSaved:
      description: Saved. The project as it is now, with its new version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectDetail' }
    VersionConflict:
      description: >
        Someone else saved first. Nothing was changed. The current version is returned so the page can offer
        Reload or Overwrite.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VersionConflict' }
    Error:
      description: >
        Every failure uses this envelope. Codes so far: unauthorized, auth_not_configured, db_unavailable,
        workspace_not_found, not_found, forbidden, invalid_json, validation_failed (with a field), precondition_required, version_conflict, no_transcripts, internal_error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      required: [status, time, version]
      properties:
        status: { type: string, enum: [ok] }
        time: { type: string }
        version: { type: string }
    DatabaseHealth:
      type: object
      required: [status, database, migrations]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [reachable] }
        migrations: { type: integer }
    VersionConflict:
      type: object
      required: [error, current]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [version_conflict] }
            message: { type: string }
        current:
          type: object
          required: [version]
          properties:
            version: { type: integer }
    StageInfo:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: object
          required: [plan, tasks, transcripts, themes, journey, prio, requirements, stories]
          properties:
            plan: { $ref: '#/components/schemas/StageTab' }
            tasks: { $ref: '#/components/schemas/StageTab' }
            transcripts: { $ref: '#/components/schemas/StageTab' }
            themes: { $ref: '#/components/schemas/StageTab' }
            journey: { $ref: '#/components/schemas/StageTab' }
            prio: { $ref: '#/components/schemas/StageTab' }
            requirements: { $ref: '#/components/schemas/StageTab' }
            stories: { $ref: '#/components/schemas/StageTab' }
    StageTab:
      type: object
      required: [enabled, hint]
      properties:
        enabled: { type: boolean }
        hint: { type: [string, 'null'] }
    ProjectDetail:
      type: object
      required: [id, name, color, template, status, sessions, themes, highPriority, createdAt, version, study, stages, participants, tasks]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, enum: [cream, mint, yellow, coral, lavender, sky, blue, rose, peach, sand] }
        template: { type: [string, 'null'] }
        status: { type: string, enum: [draft, analyzed] }
        sessions: { type: integer }
        themes: { type: integer }
        highPriority: { type: integer }
        createdAt: { type: string }
        version: { type: integer }
        study:
          type: object
          required: [what, jtbd, outcomes, methods]
          properties:
            what: { type: [string, 'null'] }
            jtbd:
              type: object
              required: [when, want, so]
              properties:
                when: { type: [string, 'null'] }
                want: { type: [string, 'null'] }
                so: { type: [string, 'null'] }
            outcomes:
              type: array
              items: { type: string }
            methods:
              type: array
              items: { type: string }
        stages:
          type: array
          items:
            type: object
            required: [position, name]
            properties:
              position: { type: integer }
              name: { type: string }
        participants:
          type: array
          items:
            type: object
            required: [id, name, role, email, sessionDate]
            properties:
              id: { type: string }
              name: { type: string }
              role: { type: [string, 'null'] }
              email: { type: string }
              sessionDate: { type: [string, 'null'] }
        tasks:
          type: array
          items:
            type: object
            required: [id, prompt, followUps]
            properties:
              id: { type: string }
              prompt: { type: string }
              followUps:
                type: array
                items:
                  type: object
                  required: [id, prompt]
                  properties:
                    id: { type: string }
                    prompt: { type: string }
    SavePlanRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        what: { type: [string, 'null'] }
        jtbd:
          type: object
          properties:
            when: { type: [string, 'null'] }
            want: { type: [string, 'null'] }
            so: { type: [string, 'null'] }
        outcomes:
          type: array
          items: { type: string }
        methods:
          type: array
          items: { type: string }
    SaveParticipantsRequest:
      type: object
      required: [participants]
      properties:
        participants:
          type: array
          items:
            type: object
            required: [name, email]
            properties:
              id: { type: [string, 'null'], description: Present for an existing participant. }
              name: { type: string }
              role: { type: [string, 'null'] }
              email: { type: string }
              sessionDate: { type: [string, 'null'] }
    TranscriptList:
      type: object
      required: [transcripts, hasAnalysis, needsAnalysis, analyzedAt]
      properties:
        transcripts:
          type: array
          items:
            type: object
            required: [id, name, platform, rawText, lineCount, speakers]
            properties:
              id: { type: string }
              name: { type: string }
              platform: { type: [string, 'null'], enum: [zoom, meet, teams] }
              rawText: { type: string }
              lineCount: { type: integer }
              speakers:
                type: array
                items:
                  type: object
                  required: [name, role, participant]
                  properties:
                    name: { type: string }
                    role: { type: string, enum: [participant, moderator] }
                    participant: { type: [string, 'null'], description: The matched participant's name. }
        hasAnalysis: { type: boolean }
        needsAnalysis: { type: boolean, description: True when there are transcripts and the current analysis did not read exactly these. }
        analyzedAt: { type: [string, 'null'] }
    SaveTranscriptsRequest:
      type: object
      required: [transcripts]
      properties:
        transcripts:
          type: array
          items:
            type: object
            required: [name, rawText]
            properties:
              id: { type: [string, 'null'] }
              name: { type: string }
              platform: { type: [string, 'null'], enum: [zoom, meet, teams] }
              rawText: { type: string }
    AnalysisRunResult:
      type: object
      required: [runId, themes, steps]
      properties:
        runId: { type: string }
        themes: { type: integer }
        steps:
          type: array
          items: { type: string }
    SaveTasksRequest:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            type: object
            required: [prompt]
            properties:
              prompt: { type: string }
              followUps:
                type: array
                items: { type: string }
    TemplateList:
      type: object
      required: [data, methodOptions]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Template' }
        methodOptions:
          type: array
          items: { type: string }
    Template:
      type: object
      required: [key, name, description, what, jtbd, outcomes, methods, tasks]
      properties:
        key: { type: string, enum: [usability, discovery, concept, blank] }
        name: { type: string }
        description: { type: [string, 'null'] }
        what: { type: string }
        jtbd:
          type: object
          required: [when, want, so]
          properties:
            when: { type: string }
            want: { type: string }
            so: { type: string }
        outcomes:
          type: array
          items: { type: string }
        methods:
          type: array
          items: { type: string }
        tasks:
          type: array
          items:
            type: object
            required: [prompt, followUps]
            properties:
              prompt: { type: string }
              followUps:
                type: array
                items: { type: string }
    CreateProjectRequest:
      type: object
      required: [name, templateKey, participants]
      properties:
        name: { type: string }
        templateKey: { type: string, enum: [usability, discovery, concept, blank] }
        what: { type: [string, 'null'] }
        jtbd:
          type: object
          properties:
            when: { type: [string, 'null'] }
            want: { type: [string, 'null'] }
            so: { type: [string, 'null'] }
        outcomes:
          type: array
          items: { type: string }
        methods:
          type: array
          items: { type: string }
        participants:
          type: array
          description: At least one. Name and a valid email are required.
          items:
            type: object
            required: [name, email]
            properties:
              name: { type: string }
              role: { type: [string, 'null'] }
              email: { type: string }
              sessionDate: { type: [string, 'null'], description: 'YYYY-MM-DD' }
    ProjectList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectSummary' }
        next_cursor:
          type: [string, 'null']
    ProjectSummary:
      type: object
      required: [id, name, color, template, status, sessions, themes, highPriority, createdAt, version]
      properties:
        id: { type: string }
        name: { type: string }
        color:
          type: string
          description: A tint token name; the page maps it to var(--at-tint-<color>).
          enum: [cream, mint, yellow, coral, lavender, sky, blue, rose, peach, sand]
        template: { type: [string, 'null'] }
        status:
          type: string
          description: Derived, not stored. draft means the current analysis has no themes.
          enum: [draft, analyzed]
        sessions: { type: integer, description: Transcripts in the project. }
        themes: { type: integer, description: Themes in the current analysis. }
        highPriority: { type: integer, description: Themes whose suggested priority is high. }
        createdAt: { type: string }
        version: { type: integer }
    Me:
      type: object
      required: [userId, email, displayName, workspaceId, workspaceName, role]
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        workspaceId: { type: string }
        workspaceName: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
