openapi: 3.1.0
info:
  title: Signal Flow API
  version: 0.1.0
  description: >
    The spec is the contract: handlers are checked against it (server/app.test.ts), and the MCP server
    will check that every page binds to an operation listed here. Phase 2 covers the shell only.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness. Never touches the database.
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health/db:
    get:
      operationId: getDatabaseHealth
      summary: Reaches the database. Needs the same access as data routes, because it can wake a suspended compute.
      responses:
        '200':
          description: The database is reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseHealth' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getMe
      summary: >
        The user and workspace this request acts as. Without a token the role is viewer (the demo is read-only);
        with the token it is the demo owner.
      responses:
        '200':
          description: The current context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects:
    get:
      operationId: listProjects
      summary: >
        Research projects in the workspace, with the figures shown on a project card. Open to anyone for
        reading (viewer role); cached for a minute so repeated requests do not reach the database.
      responses:
        '200':
          description: The projects, newest first, then by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      summary: >
        Creates a project with its test plan, journey stages, participants and the template's starter tasks,
        in one transaction. Needs the token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: The new project, as it appears on a project card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /projects/{id}:
    delete:
      operationId: deleteProject
      summary: >
        Permanently deletes a project and everything under it (a hard delete; the page asks for confirmation first).
        The audit log keeps the name, actor and time. Needs the token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /templates:
    get:
      operationId: listTemplates
      summary: Study templates (usability, discovery, concept, blank) and the list of research methods.
      responses:
        '200':
          description: The templates, in display order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: >
        Every failure uses this envelope. Codes so far: unauthorized, auth_not_configured, db_unavailable,
        workspace_not_found, not_found, forbidden, invalid_json, validation_failed (with a field), internal_error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      required: [status, time, version]
      properties:
        status: { type: string, enum: [ok] }
        time: { type: string }
        version: { type: string }
    DatabaseHealth:
      type: object
      required: [status, database, migrations]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [reachable] }
        migrations: { type: integer }
    TemplateList:
      type: object
      required: [data, methodOptions]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Template' }
        methodOptions:
          type: array
          items: { type: string }
    Template:
      type: object
      required: [key, name, description, what, jtbd, outcomes, methods, tasks]
      properties:
        key: { type: string, enum: [usability, discovery, concept, blank] }
        name: { type: string }
        description: { type: [string, 'null'] }
        what: { type: string }
        jtbd:
          type: object
          required: [when, want, so]
          properties:
            when: { type: string }
            want: { type: string }
            so: { type: string }
        outcomes:
          type: array
          items: { type: string }
        methods:
          type: array
          items: { type: string }
        tasks:
          type: array
          items:
            type: object
            required: [prompt, followUps]
            properties:
              prompt: { type: string }
              followUps:
                type: array
                items: { type: string }
    CreateProjectRequest:
      type: object
      required: [name, templateKey, participants]
      properties:
        name: { type: string }
        templateKey: { type: string, enum: [usability, discovery, concept, blank] }
        what: { type: [string, 'null'] }
        jtbd:
          type: object
          properties:
            when: { type: [string, 'null'] }
            want: { type: [string, 'null'] }
            so: { type: [string, 'null'] }
        outcomes:
          type: array
          items: { type: string }
        methods:
          type: array
          items: { type: string }
        participants:
          type: array
          description: At least one. Name and a valid email are required.
          items:
            type: object
            required: [name, email]
            properties:
              name: { type: string }
              role: { type: [string, 'null'] }
              email: { type: string }
              sessionDate: { type: [string, 'null'], description: 'YYYY-MM-DD' }
    ProjectList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectSummary' }
        next_cursor:
          type: [string, 'null']
    ProjectSummary:
      type: object
      required: [id, name, color, template, status, sessions, themes, highPriority, createdAt, version]
      properties:
        id: { type: string }
        name: { type: string }
        color:
          type: string
          description: A tint token name; the page maps it to var(--at-tint-<color>).
          enum: [cream, mint, yellow, coral, lavender, sky, blue, rose, peach, sand]
        template: { type: [string, 'null'] }
        status:
          type: string
          description: Derived, not stored. draft means the current analysis has no themes.
          enum: [draft, analyzed]
        sessions: { type: integer, description: Transcripts in the project. }
        themes: { type: integer, description: Themes in the current analysis. }
        highPriority: { type: integer, description: Themes whose suggested priority is high. }
        createdAt: { type: string }
        version: { type: integer }
    Me:
      type: object
      required: [userId, email, displayName, workspaceId, workspaceName, role]
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        workspaceId: { type: string }
        workspaceName: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
